services:
  ingress:
    image: caddy:2.11.4-alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    entrypoint:
      - /bin/sh
      - /usr/local/bin/validate-private-lan-https.sh
    environment:
      SETTLEORA_API_BIND_ADDRESS: ${SETTLEORA_API_BIND_ADDRESS:?Set SETTLEORA_API_BIND_ADDRESS to one private RFC1918 host interface}
      SETTLEORA_API_HTTPS_PORT: ${SETTLEORA_API_HTTPS_PORT:-8443}
      SETTLEORA_HTTPS_HOSTNAME: ${SETTLEORA_HTTPS_HOSTNAME:?Set SETTLEORA_HTTPS_HOSTNAME to the certificate hostname}
      SETTLEORA_START_CADDY: "1"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${SETTLEORA_API_BIND_ADDRESS:?Set SETTLEORA_API_BIND_ADDRESS to one private RFC1918 host interface}:${SETTLEORA_API_HTTPS_PORT:-8443}:8443"
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /config
      - /data
    volumes:
      - type: bind
        source: ./caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./caddy/validate-private-lan-https.sh
        target: /usr/local/bin/validate-private-lan-https.sh
        read_only: true
      - type: bind
        source: ${SETTLEORA_TLS_CERTIFICATE_PATH:?Set SETTLEORA_TLS_CERTIFICATE_PATH to the external certificate chain file}
        target: /run/settleora-tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SETTLEORA_TLS_PRIVATE_KEY_PATH:?Set SETTLEORA_TLS_PRIVATE_KEY_PATH to the external private key file}
        target: /run/settleora-tls/tls.key
        read_only: true
        bind:
          create_host_path: false

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["migrate-database", "--mode=${SETTLEORA_DATABASE_MIGRATION_MODE:-managed-auto}"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${SETTLEORA_ENVIRONMENT:-Development}
      Settleora__Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      SETTLEORA_DATABASE_MIGRATION_MODE: ${SETTLEORA_DATABASE_MIGRATION_MODE:-managed-auto}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${SETTLEORA_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      Settleora__Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Settleora__RabbitMq__HostName: rabbitmq
      Settleora__RabbitMq__Port: 5672
      Settleora__RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      Settleora__RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      Settleora__RabbitMq__VirtualHost: /
      Settleora__Storage__Provider: Local
      Settleora__Storage__RootPath: ${SETTLEORA_STORAGE_ROOT:-/var/lib/settleora/storage}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${SETTLEORA_API_STORAGE_HOST_PATH}
        target: ${SETTLEORA_STORAGE_ROOT:-/var/lib/settleora/storage}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${SETTLEORA_POSTGRES_HOST_PATH}
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: "${SETTLEORA_RABBITMQ_NODE_HOSTNAME:?Set SETTLEORA_RABBITMQ_NODE_HOSTNAME to the persistent RabbitMQ node hostname}"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/settleora-rabbitmq-entrypoint.sh
    command:
      - rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_NODENAME: "rabbit@${SETTLEORA_RABBITMQ_NODE_HOSTNAME:?Set SETTLEORA_RABBITMQ_NODE_HOSTNAME to the persistent RabbitMQ node hostname}"
    volumes:
      - type: bind
        source: ${SETTLEORA_RABBITMQ_HOST_PATH}
        target: /var/lib/rabbitmq
      - type: bind
        source: ./rabbitmq/settleora-entrypoint.sh
        target: /usr/local/bin/settleora-rabbitmq-entrypoint.sh
        read_only: true
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
