{# Replaced exactly once by the repository materializer. A release lock lives
   in template source so middleware-preserved undeclared values cannot replace
   both the expected and effective image/config identities. #}
{% set release_lock = __SETTLEORA_RELEASE_LOCK__ %}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set allowed_top_level = ["TZ", "acknowledgements", "consts", "images", "ix_certificates", "ix_context", "ix_volumes", "network", "release_identity", "resources", "settleora", "skip_id_variables", "storage"] %}
{% for value_key in values.keys() %}
  {% if value_key not in allowed_top_level %}
    {% do tpl.funcs.fail("Unsupported top-level package input") %}
  {% endif %}
{% endfor %}
{% for value_key in values.settleora.keys() %}
  {% if value_key not in ["deployment_mode", "migration_mode", "postgres_database", "postgres_password", "postgres_user", "rabbitmq_node_hostname", "rabbitmq_password", "rabbitmq_user"] %}
    {% do tpl.funcs.fail("Unsupported Settleora package input") %}
  {% endif %}
{% endfor %}
{% for value_key in values.network.keys() %}
  {% if value_key not in ["bind_address", "certificate_id", "hostname", "https_port"] %}
    {% do tpl.funcs.fail("Unsupported network package input") %}
  {% endif %}
{% endfor %}
{% for value_key in values.storage.keys() %}
  {% if value_key not in ["api_storage_dataset", "postgres_dataset", "rabbitmq_dataset"] %}
    {% do tpl.funcs.fail("Unsupported storage package input") %}
  {% endif %}
{% endfor %}
{% for value_key in values.acknowledgements.keys() %}
  {% if value_key not in ["backup_before_upgrade", "lan_only", "rollback_limit"] %}
    {% do tpl.funcs.fail("Unsupported acknowledgement package input") %}
  {% endif %}
{% endfor %}
{% if values.images != release_lock.images or values.consts != release_lock.consts or values.resources != release_lock.resources or values.release_identity != release_lock.release_identity or values.TZ != release_lock.TZ or values.skip_id_variables != release_lock.skip_id_variables %}
  {% do tpl.funcs.fail("Materialized release lock mismatch") %}
{% endif %}
{% if values.get("ix_volumes", {}) %}
  {% do tpl.funcs.fail("Undeclared TrueNAS-managed volumes are unsupported") %}
{% endif %}

{% if values.settleora.deployment_mode != "lan-private" %}
  {% do tpl.funcs.fail("Only lan-private deployment mode is supported") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.network.bind_address, "^(10\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])|172\\.(?:1[6-9]|2[0-9]|3[01])\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])|192\\.168\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\\.(?:0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5]))$") %}
  {% do tpl.funcs.fail("The ingress bind address must be one canonical RFC1918 IPv4 address") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.network.hostname, "^(?=.{1,253}$)(?!.*\\.\\.)(?!localhost$)(?!.*\\.localhost$)[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$") or "." not in values.network.hostname %}
  {% do tpl.funcs.fail("An exact private fully qualified HTTPS hostname is required") %}
{% endif %}
{% for hostname_label in values.network.hostname.split(".") %}
  {% if not tpl.funcs.match_regex(hostname_label, "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$") %}
    {% do tpl.funcs.fail("Every private HTTPS hostname label must be a valid DNS label") %}
  {% endif %}
{% endfor %}
{% if not values.network.certificate_id or values.network.certificate_id not in values.ix_certificates %}
  {% do tpl.funcs.fail("An externally managed TrueNAS TLS certificate reference is required") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.settleora.postgres_database, "^[A-Za-z_][A-Za-z0-9_]{0,62}$") or not tpl.funcs.match_regex(values.settleora.postgres_user, "^[A-Za-z_][A-Za-z0-9_]{0,62}$") %}
  {% do tpl.funcs.fail("PostgreSQL database and user identifiers are invalid") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.settleora.rabbitmq_user, "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,62}$") %}
  {% do tpl.funcs.fail("RabbitMQ user identifier is invalid") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.settleora.postgres_password, "^[A-Za-z0-9._~-]{16,128}$") or not tpl.funcs.match_regex(values.settleora.rabbitmq_password, "^[A-Za-z0-9._~-]{16,128}$") %}
  {% do tpl.funcs.fail("PostgreSQL and RabbitMQ secrets must use the bounded safe character set") %}
{% endif %}
{% if not tpl.funcs.match_regex(values.settleora.rabbitmq_node_hostname, "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$") %}
  {% do tpl.funcs.fail("The stable RabbitMQ node hostname is invalid") %}
{% endif %}
{% if values.settleora.migration_mode not in ["managed-auto", "apply-safe", "manual", "check-only", "validate-only"] %}
  {% do tpl.funcs.fail("Unsupported or destructive migration mode") %}
{% endif %}
{% for dataset in [values.storage.postgres_dataset, values.storage.rabbitmq_dataset, values.storage.api_storage_dataset] %}
  {% if not tpl.funcs.match_regex(dataset, "^/mnt/[A-Za-z0-9._/-]+$") or ".." in dataset or "//" in dataset or "/./" in dataset or dataset.endswith("/.") or dataset.endswith("/") %}
    {% do tpl.funcs.fail("Every dataset must be an unambiguous TrueNAS /mnt host path") %}
  {% endif %}
{% endfor %}
{% if values.storage.postgres_dataset == values.storage.rabbitmq_dataset or values.storage.postgres_dataset == values.storage.api_storage_dataset or values.storage.rabbitmq_dataset == values.storage.api_storage_dataset %}
  {% do tpl.funcs.fail("PostgreSQL, RabbitMQ, and API storage datasets must be distinct") %}
{% endif %}
{% set datasets = [values.storage.postgres_dataset, values.storage.rabbitmq_dataset, values.storage.api_storage_dataset] %}
{% set canonical_datasets = [] %}
{% for dataset in datasets %}
  {% set canonical_dataset = dataset %}
  {# TrueNAS middleware reserves and injects ix_context for every lifecycle
     render. Its hostpath schema currently checks existence only, so obtain the
     authoritative real path and reject every symlink component here. The
     context-free official offline renderer exercises the lexical fallback. #}
  {% if values.get("ix_context", {}).get("app_name") %}
    {% set dataset_stat = tpl.client.client.call("filesystem.stat", dataset) %}
    {% if not dataset_stat or dataset_stat.type != "DIRECTORY" or dataset_stat.realpath != dataset %}
      {% do tpl.funcs.fail("Every live TrueNAS dataset must be a canonical, non-symlinked directory") %}
    {% endif %}
    {% set canonical_dataset = dataset_stat.realpath %}
  {% endif %}
  {% do canonical_datasets.append(canonical_dataset) %}
{% endfor %}
{% for dataset in canonical_datasets %}
  {% for other_dataset in canonical_datasets %}
    {% if dataset != other_dataset and dataset.startswith(other_dataset ~ "/") %}
      {% do tpl.funcs.fail("PostgreSQL, RabbitMQ, and API storage datasets must not be nested") %}
    {% endif %}
  {% endfor %}
{% endfor %}
{% if not values.acknowledgements.lan_only or not values.acknowledgements.backup_before_upgrade or not values.acknowledgements.rollback_limit %}
  {% do tpl.funcs.fail("All LAN, backup, and rollback acknowledgements are required") %}
{% endif %}

{% set ingress_net = tpl.networks.create_internal("ingress") %}
{% set backend_net = tpl.networks.create_internal("backend") %}
{% set cert = values.ix_certificates[values.network.certificate_id] %}
{% set host_storage = {"type": "host_path", "read_only": false, "host_path_config": {"create_host_path": false, "propagation": "rprivate"}} %}

{% set caddyfile %}{
  admin off
  auto_https off
  log default {
    level ERROR
    format filter {
      wrap json
      fields { request delete }
    }
  }
}
https://{{ values.network.hostname }}:8443 {
  tls /run/settleora-tls/tls.crt /run/settleora-tls/tls.key
  reverse_proxy api:8080
}
{% endset %}

{% set rabbit_entrypoint %}#!/bin/sh
set -eu
expected_nodename="rabbit@$(hostname -s)"
configured_nodename="${RABBITMQ_NODENAME:?RABBITMQ_NODENAME is required for persistent RabbitMQ data}"
[ "$configured_nodename" = "$expected_nodename" ] || { echo >&2 "RabbitMQ persistence identity refused: configured node name does not match the container hostname."; exit 64; }
mnesia_base="${RABBITMQ_MNESIA_BASE:-/var/lib/rabbitmq/mnesia}"
if [ -d "$mnesia_base" ]; then
  persisted_nodename=""
  for candidate in "$mnesia_base"/rabbit@*; do
    [ -d "$candidate" ] || continue
    candidate_nodename="${candidate##*/}"
    case "$candidate_nodename" in
      *-plugins-expand)
        if [ -d "${candidate%-plugins-expand}" ] && [ ! -e "$candidate/schema.DAT" ] && [ ! -e "$candidate/node-type.txt" ] && [ ! -d "$candidate/msg_stores" ]; then continue; fi
        ;;
    esac
    [ -z "$persisted_nodename" ] || [ "$persisted_nodename" = "$candidate_nodename" ] || { echo >&2 "RabbitMQ persistence identity refused: the data path contains more than one node database."; exit 65; }
    persisted_nodename="$candidate_nodename"
  done
  [ -z "$persisted_nodename" ] || [ "$persisted_nodename" = "$configured_nodename" ] || { echo >&2 "RabbitMQ persistence identity refused: the configured node does not match the persisted node database."; exit 66; }
fi
exec /usr/local/bin/docker-entrypoint.sh "$@"
{% endset %}

{% set caddy_entrypoint %}#!/bin/sh
set -eu
# Copying the capability-bearing image binary into private tmpfs drops its
# low-port file capability before capability-free startup on port 8443.
cp /usr/bin/caddy /tmp/settleora-caddy
chmod 0555 /tmp/settleora-caddy
exec /tmp/settleora-caddy "$@"
{% endset %}

{% set migrate_entrypoint %}#!/bin/sh
set -eu
mode="${1:?A migration mode is required}"
case "$mode" in
  validate-only)
    dotnet Settleora.Api.dll migrate-database --mode=validate-only
    exec dotnet Settleora.Api.dll migrate-database --mode=check-only
    ;;
  managed-auto|apply-safe|manual|check-only)
    exec dotnet Settleora.Api.dll migrate-database --mode="$mode"
    ;;
  *)
    echo >&2 "Unsupported or destructive migration mode"
    exit 64
    ;;
esac
{% endset %}

{% set api_entrypoint %}#!/bin/sh
set -eu
[ "$(id -u)" = "999" ] && [ "$(id -g)" = "999" ] || { echo >&2 "API startup refused: expected runtime UID/GID 999."; exit 64; }
data_path=/var/lib/settleora/storage
[ -d "$data_path" ] && [ -r "$data_path" ] && [ -w "$data_path" ] && [ -x "$data_path" ] || { echo >&2 "API startup refused: the private storage dataset must grant UID/GID 999 read, write, and traverse access."; exit 65; }
probe="$data_path/.settleora-write-probe-$$"
trap 'rm -f "$probe"' EXIT HUP INT TERM
umask 077
: > "$probe" || { echo >&2 "API startup refused: the private storage dataset is not writable by UID/GID 999."; exit 66; }
rm -f "$probe"
trap - EXIT HUP INT TERM
mkdir -p "$data_path/.settleora-home"
chmod 0700 "$data_path/.settleora-home"
exec dotnet Settleora.Api.dll "$@"
{% endset %}

{% set ingress = tpl.add_container(values.consts.caddy_container_name, "caddy_image") %}
{% do ingress.set_user(1000, 1000) %}
{% do ingress.set_read_only(true) %}
{% do ingress.restart.set_policy("no") %}
{% do ingress.set_entrypoint(["/bin/sh", "/usr/local/bin/settleora-caddy-entrypoint.sh"]) %}
{% do ingress.set_command(["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]) %}
{% do ingress.healthcheck.set_custom_test(["CMD", "/tmp/settleora-caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]) %}
{% do ingress.add_network(ingress_net) %}
{% do ingress.configs.add("settleora-caddyfile", caddyfile, "/etc/caddy/Caddyfile", "0444") %}
{% do ingress.configs.add("settleora-caddy-entrypoint", caddy_entrypoint, "/usr/local/bin/settleora-caddy-entrypoint.sh", "0555") %}
{% do ingress.configs.add("settleora-tls-certificate", cert.certificate, "/run/settleora-tls/tls.crt", "0444") %}
{% do ingress.configs.add("settleora-tls-private-key", cert.privatekey, "/run/settleora-tls/tls.key", "0400") %}
{% do ingress.add_storage("/config", {"type": "tmpfs", "tmpfs_config": {"mode": "0700", "uid": 1000, "gid": 1000}}) %}
{% do ingress.add_storage("/data", {"type": "tmpfs", "tmpfs_config": {"mode": "0700", "uid": 1000, "gid": 1000}}) %}
{% do ingress.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"mode": "0700", "uid": 1000, "gid": 1000}}) %}

{% set migrate = tpl.add_container(values.consts.migrate_container_name, "api_image") %}
{% do migrate.restart.set_policy("no") %}
{% do migrate.healthcheck.disable() %}
{% do migrate.set_entrypoint(["/bin/sh", "/usr/local/bin/settleora-migrate-entrypoint.sh"]) %}
{% do migrate.set_command([values.settleora.migration_mode]) %}
{% do migrate.configs.add("settleora-migrate-entrypoint", migrate_entrypoint, "/usr/local/bin/settleora-migrate-entrypoint.sh", "0555") %}
{% do migrate.environment.add_env("ASPNETCORE_ENVIRONMENT", "Production") %}
{% do migrate.environment.add_env("Settleora__Database__ConnectionString", "Host=postgres;Port=5432;Database=" ~ values.settleora.postgres_database ~ ";Username=" ~ values.settleora.postgres_user ~ ";Password=" ~ values.settleora.postgres_password) %}
{% do migrate.environment.add_env("SETTLEORA_DATABASE_MIGRATION_MODE", values.settleora.migration_mode) %}
{% do migrate.add_network(backend_net) %}

{% set api = tpl.add_container(values.consts.api_container_name, "api_image") %}
{% do api.set_entrypoint(["/bin/sh", "/usr/local/bin/settleora-api-entrypoint.sh"]) %}
{% do api.healthcheck.set_test("http", {"port": 8080, "path": "/health/ready"}) %}
{% do api.configs.add("settleora-api-entrypoint", api_entrypoint, "/usr/local/bin/settleora-api-entrypoint.sh", "0555") %}
{% do api.environment.add_env("ASPNETCORE_ENVIRONMENT", "Production") %}
{% do api.environment.add_env("ASPNETCORE_URLS", "http://+:8080") %}
{% do api.environment.add_env("HOME", "/var/lib/settleora/storage/.settleora-home") %}
{% do api.environment.add_env("Auth__Passkeys__RelyingPartyId", values.network.hostname) %}
{% if values.network.https_port == 443 %}
  {% do api.environment.add_env("Auth__Passkeys__AllowedOrigins__0", "https://" ~ values.network.hostname) %}
{% else %}
  {% do api.environment.add_env("Auth__Passkeys__AllowedOrigins__0", "https://" ~ values.network.hostname ~ ":" ~ values.network.https_port) %}
{% endif %}
{% do api.environment.add_env("Settleora__Database__ConnectionString", "Host=postgres;Port=5432;Database=" ~ values.settleora.postgres_database ~ ";Username=" ~ values.settleora.postgres_user ~ ";Password=" ~ values.settleora.postgres_password) %}
{% do api.environment.add_env("Settleora__RabbitMq__HostName", "rabbitmq") %}
{% do api.environment.add_env("Settleora__RabbitMq__Port", "5672") %}
{% do api.environment.add_env("Settleora__RabbitMq__UserName", values.settleora.rabbitmq_user) %}
{% do api.environment.add_env("Settleora__RabbitMq__Password", values.settleora.rabbitmq_password) %}
{% do api.environment.add_env("Settleora__RabbitMq__VirtualHost", "/") %}
{% do api.environment.add_env("Settleora__Storage__Provider", "Local") %}
{% do api.environment.add_env("Settleora__Storage__RootPath", values.consts.storage_root) %}
{% do api.add_port({"bind_mode": "exposed", "port_number": 8080, "container_port": 8080}) %}
{% do api.add_network(ingress_net) %}
{% do api.add_network(backend_net) %}
{% set api_storage = tpl.funcs.copy_dict(host_storage) %}
{% do api_storage.host_path_config.update({"path": values.storage.api_storage_dataset}) %}
{% do api.add_storage("/var/lib/settleora/storage", api_storage) %}

{% set postgres = tpl.add_container(values.consts.postgres_container_name, "postgres_image") %}
{% do postgres.clear_caps() %}
{% do postgres.healthcheck.set_test("postgres", {"user": values.settleora.postgres_user, "db": values.settleora.postgres_database, "port": 5432}) %}
{% do postgres.environment.add_env("POSTGRES_DB", values.settleora.postgres_database) %}
{% do postgres.environment.add_env("POSTGRES_USER", values.settleora.postgres_user) %}
{% do postgres.environment.add_env("POSTGRES_PASSWORD", values.settleora.postgres_password) %}
{% do postgres.add_network(backend_net) %}
{% set postgres_storage = tpl.funcs.copy_dict(host_storage) %}
{% do postgres_storage.host_path_config.update({"path": values.storage.postgres_dataset}) %}
{% do postgres.add_storage("/var/lib/postgresql/data", postgres_storage) %}

{% set rabbitmq = tpl.add_container(values.consts.rabbitmq_container_name, "rabbitmq_image") %}
{% do rabbitmq.clear_caps() %}
{% do rabbitmq.set_hostname(values.settleora.rabbitmq_node_hostname) %}
{% do rabbitmq.set_entrypoint(["/bin/sh", "/usr/local/bin/settleora-rabbitmq-entrypoint.sh"]) %}
{% do rabbitmq.set_command(["rabbitmq-server"]) %}
{% do rabbitmq.healthcheck.set_custom_test(["CMD", "rabbitmq-diagnostics", "ping"]) %}
{% do rabbitmq.environment.add_env("RABBITMQ_DEFAULT_USER", values.settleora.rabbitmq_user) %}
{% do rabbitmq.environment.add_env("RABBITMQ_DEFAULT_PASS", values.settleora.rabbitmq_password) %}
{% do rabbitmq.environment.add_env("RABBITMQ_NODENAME", "rabbit@" ~ values.settleora.rabbitmq_node_hostname) %}
{% do rabbitmq.add_network(backend_net) %}
{% do rabbitmq.configs.add("settleora-rabbitmq-entrypoint", rabbit_entrypoint, "/usr/local/bin/settleora-rabbitmq-entrypoint.sh", "0555") %}
{% set rabbitmq_storage = tpl.funcs.copy_dict(host_storage) %}
{% do rabbitmq_storage.host_path_config.update({"path": values.storage.rabbitmq_dataset}) %}
{% do rabbitmq.add_storage("/var/lib/rabbitmq", rabbitmq_storage) %}

{% do migrate.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do api.depends.add_dependency(values.consts.migrate_container_name, "service_completed_successfully") %}
{% do api.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{% do api.depends.add_dependency(values.consts.rabbitmq_container_name, "service_healthy") %}
{% do ingress.depends.add_dependency(values.consts.api_container_name, "service_healthy") %}

{% set rendered = tpl.render() %}
{% do rendered.networks[ingress_net].update({"internal": true}) %}
{% do rendered.networks[backend_net].update({"internal": true}) %}
{# TrueNAS 25.10.x lacks port.validate_ports and its singular fallback can hang
   over websocket (truenas/apps#5276). Preserve the official Compose shape
   without calling that incompatible helper; Docker still fails closed if the
   exact address/port is unavailable during a future manually gated install. #}
{% do rendered.services.ingress.update({"ports": [{"host_ip": values.network.bind_address, "mode": "ingress", "protocol": "tcp", "published": values.network.https_port, "target": values.consts.internal_https_port}]}) %}
{% do rendered.networks.update({"edge": {}}) %}
{% do rendered.services.ingress.networks.update({"edge": {"gw_priority": 1}}) %}
{% do rendered.update({"x-settleora-release": values.release_identity}) %}
{{ rendered | tojson }}
