    ReceiptOcrReviewApplyPreviewIssueCode:
      type: string
      description: Bounded receipt OCR apply-preview validation issue code. Codes in blockedReasons make canApply false; codes in warnings may be informational or blocking.
      enum:
        - unsupported_review_status
        - unsupported_review_source
        - missing_currency
        - unsupported_currency
        - currency_mismatch
        - missing_grand_total
        - empty_line_set
        - line_total_missing
        - unsupported_line_state
        - line_total_mismatch
        - line_sum_mismatch
        - header_total_mismatch
    ReceiptOcrReviewApplyPreviewLineCandidateResponse:
      type: object
      description: Safe proposed bill-item candidate derived from one bounded receipt OCR review line. It excludes bill-item IDs, split allocation input, raw OCR text, file bytes, storage/provider internals, payment details, and unrelated users.
      required:
        - reviewLineId
        - sortOrder
        - text
        - quantity
        - unitPriceAmount
        - lineTotalAmount
        - proposedLineTotalAmount
      properties:
        reviewLineId:
          type: string
          format: uuid
          description: Stable OCR review line ID used only for UI correlation within this preview.
        sortOrder:
          type: integer
          minimum: 0
        text:
          type: string
          maxLength: 240
        quantity:
          oneOf:
            - type: string
            - type: "null"
        unitPriceAmount:
          oneOf:
            - type: string
            - type: "null"
        lineTotalAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Stored OCR review line total candidate when present.
        proposedLineTotalAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Decimal-string line total the preview can safely propose, using the stored line total when present or a quantity times unit-price derivation when possible.
    ReceiptOcrReviewApplyPreviewSummaryResponse:
      type: object
      description: Decimal-string and count summary derived from the saved OCR review. The summary is preview data only and is not authoritative bill, split, settlement, payment, or balance state.
      required:
        - lineCount
        - linesWithProposedTotalCount
        - linesMissingProposedTotalCount
        - proposedLineTotalSumAmount
        - expectedHeaderTotalAmount
      properties:
        lineCount:
          type: integer
          minimum: 0
          maximum: 100
        linesWithProposedTotalCount:
          type: integer
          minimum: 0
          maximum: 100
        linesMissingProposedTotalCount:
          type: integer
          minimum: 0
          maximum: 100
        proposedLineTotalSumAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Sum of safely proposed line totals when at least one line total can be proposed.
        expectedHeaderTotalAmount:
          oneOf:
            - type: string
            - type: "null"
          description: Header total derived as subtotal plus tax plus service charge minus discount when subtotal is available.
    ReceiptOcrReviewApplyPreviewResponse:
      type: object
      description: Safe non-mutating bill-draft preview derived from one saved receipt OCR review. It exposes only proposed header fields, proposed line candidates, decimal-string summary totals, canApply, blockedReasons, warnings, and stable review/bill/file IDs. It excludes raw OCR full text, receipt bytes, storage object keys, provider paths, signed URLs, filenames, auth/session data, payment details, raw audit metadata, bill split/settlement/payment/balance internals, worker state, and unrelated users.
      required:
        - reviewId
        - billId
        - groupId
        - fileId
        - status
        - source
        - proposedMerchantText
        - proposedReceiptIssuedAtUtc
        - proposedCurrency
        - proposedSubtotalAmount
        - proposedTaxAmount
        - proposedServiceChargeAmount
        - proposedDiscountAmount
        - proposedGrandTotalAmount
        - proposedLines
        - summary
        - canApply
        - blockedReasons
        - warnings
        - createdAtUtc
        - updatedAtUtc
      properties:
        reviewId:
          type: string
          format: uuid
          description: Stable receipt OCR review ID.
        billId:
          type: string
          format: uuid
          description: Expense bill ID that owns the receipt attachment.
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Owning group ID for group bills, or null for personal bills.
        fileId:
          type: string
          format: uuid
          description: Stable file metadata ID of the reviewed receipt attachment.
        status:
          $ref: "#/components/schemas/ReceiptOcrReviewStatus"
        source:
          $ref: "#/components/schemas/ReceiptOcrReviewSource"
        proposedMerchantText:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        proposedReceiptIssuedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        proposedCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        proposedSubtotalAmount:
          oneOf:
            - type: string
            - type: "null"
        proposedTaxAmount:
          oneOf:
            - type: string
            - type: "null"
        proposedServiceChargeAmount:
          oneOf:
            - type: string
            - type: "null"
        proposedDiscountAmount:
          oneOf:
            - type: string
            - type: "null"
        proposedGrandTotalAmount:
          oneOf:
            - type: string
            - type: "null"
        proposedLines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewLineCandidateResponse"
        summary:
          $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewSummaryResponse"
        canApply:
          type: boolean
          description: True only when no blocking preview validation issue was derived.
        blockedReasons:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewIssueCode"
          description: Blocking validation issue codes that make canApply false.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewIssueCode"
          description: Bounded validation issue codes for UI confirmation.
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    ReceiptOcrReviewApplyMode:
      type: string
      description: Day 1 receipt OCR review apply mode. Only replacement of prior OCR-generated draft item candidates from the same review source is supported.
      enum:
        - replace_draft_ocr_items
    ReceiptOcrReviewApplyRequest:
      type: object
      description: Explicit receipt OCR review apply request. The server derives actor identity, bill/review truth, line candidates, money totals, split safety, attachment/file visibility, and audit metadata; clients submit only the mode and expected saved-review timestamp for stale-apply prevention.
      additionalProperties: false
      required:
