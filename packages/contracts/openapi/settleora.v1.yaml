          description: Draft had already been generated for this template occurrence and is returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBillGenerateDraftResponse"
        "201":
          description: Draft bill generated for this template occurrence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringBillGenerateDraftResponse"
        "400":
