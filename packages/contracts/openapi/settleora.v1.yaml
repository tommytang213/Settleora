      description: Viewer-specific baseline selected by the server. If no safe prior acceptance, approval, or rejection is derivable, clients should default to full bill review.
      required:
        - baselineType
        - baselineBillRevisionId
        - baselineRevisionStatus
        - baselineReviewedAtUtc
        - derivationReason
      properties:
        baselineType:
          $ref: "#/components/schemas/BillRevisionReviewBaselineType"
        baselineBillRevisionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        baselineRevisionStatus:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillRevisionStatus"
            - type: "null"
        baselineReviewedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        derivationReason:
          type: string
          enum:
            - derived_from_previous_revision_approval_state
            - derived_from_current_active_bill_acceptance_or_payer_confirmation
            - no_safe_prior_acceptance_review_or_rejection_found
    BillRevisionViewerFinancialImpactResponse:
      type: object
      description: Viewer-specific authoritative money impact. Money values are decimal-safe strings with currency; nullable fields mean no safe viewer baseline or no applicable payer/participant role.
      required:
        - previousShare
        - proposedShare
        - deltaShare
        - affectedByRevision
        - isPayer
        - payerImpact
      properties:
        previousShare:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        proposedShare:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        deltaShare:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        affectedByRevision:
          type: boolean
        isPayer:
          type: boolean
        payerImpact:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionPayerFinancialImpactResponse"
            - type: "null"
    BillRevisionPayerFinancialImpactResponse:
      type: object
      description: Viewer-specific payer impact and payer confirmation state when the viewer is a proposed payer.
      required:
        - previousContribution
        - proposedContribution
        - deltaContribution
        - requiresPayerConfirmation
        - payerConfirmationStatus
      properties:
        previousContribution:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        proposedContribution:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        deltaContribution:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionMoneyValueResponse"
            - type: "null"
        requiresPayerConfirmation:
          type: boolean
        payerConfirmationStatus:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillPayerConfirmationStatus"
            - type: "null"
    BillRevisionMoneyValueResponse:
      type: object
      description: Decimal-safe money value with currency.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal-safe amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    BillRevisionChangeCategorySummaryResponse:
      type: object
      description: Server-generated review-diff category count and support status.
      required:
        - category
        - supportStatus
        - changeCount
        - viewerImpact
      properties:
        category:
          $ref: "#/components/schemas/BillRevisionReviewChangeCategory"
        supportStatus:
          $ref: "#/components/schemas/BillRevisionReviewSupportStatus"
        changeCount:
          type: integer
          minimum: 0
        viewerImpact:
          $ref: "#/components/schemas/BillRevisionReviewSummaryViewerImpact"
    BillRevisionChangeResponse:
      type: object
      description: One server-generated change marker for changed-only rendering and accessible inline highlights. It never includes raw notes, storage paths, object keys, OCR text, auth/session data, or unrelated user display data.
      required:
        - changeId
        - changeType
        - changeScope
        - fieldPath
        - relatedUserProfileId
        - before
        - after
        - viewerImpact
        - accessibleLabel
        - reason
      properties:
        changeId:
          type: string
          description: Stable server-generated change ID within this revision response.
        changeType:
          $ref: "#/components/schemas/BillRevisionReviewChangeType"
        changeScope:
          $ref: "#/components/schemas/BillRevisionReviewChangeScope"
        fieldPath:
          type: string
          description: Bounded safe location for client-side row filtering/highlighting.
        relatedUserProfileId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        before:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionDisplayValueResponse"
            - type: "null"
        after:
          oneOf:
            - $ref: "#/components/schemas/BillRevisionDisplayValueResponse"
            - type: "null"
        viewerImpact:
          $ref: "#/components/schemas/BillRevisionReviewChangeViewerImpact"
        accessibleLabel:
          type: string
          description: Non-color-only marker text that screen readers and visual clients can render.
        reason:
          type: string
          enum:
            - total_amount_or_currency_changed
            - participant_share_amount_or_currency_changed
            - payer_contribution_amount_or_currency_changed
            - payer_role_added_or_removed
    BillRevisionDisplayValueResponse:
      type: object
      description: Safe display value for a before/after marker.
      required:
        - displayValue
        - amount
        - currency
      properties:
        displayValue:
          type: string
        amount:
          oneOf:
            - type: string
            - type: "null"
        currency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
    BillRevisionReviewBaselineType:
      type: string
      enum:
        - no_prior_baseline
        - active_accepted_bill
        - previous_revision_approval
        - previous_revision_rejection
    BillRevisionReviewViewMode:
      type: string
      enum:
        - full_bill
        - changed_only
    BillRevisionReviewRecommendationReason:
      type: string
      enum:
        - no_prior_baseline_full_bill_recommended
        - baseline_available_full_view_optional
    BillRevisionReviewChangeCategory:
      type: string
      enum:
        - bill_total
        - participant_share
        - payer_contribution
        - payer_role
        - item
        - item_split
        - adjustment
        - attachment_receipt_ocr_review
        - note_metadata
    BillRevisionReviewSupportStatus:
      type: string
      enum:
        - supported
        - unsupported_in_current_revision_snapshot
    BillRevisionReviewSummaryViewerImpact:
      type: string
      enum:
        - viewer_affected
        - viewer_unaffected
        - not_available
    BillRevisionReviewChangeType:
      type: string
      enum:
        - bill_total_changed
        - participant_share_added
        - participant_share_removed
        - participant_share_changed
        - payer_role_added
        - payer_role_removed
        - payer_contribution_changed
    BillRevisionReviewChangeScope:
      type: string
      enum:
        - bill_total
        - participant_share
        - payer_contribution
        - payer_role
    BillRevisionReviewChangeViewerImpact:
      type: string
      enum:
        - direct_viewer_money_impact
        - direct_viewer_payer_impact
        - bill_context
        - no_direct_viewer_impact
    ExpenseBillReconciliationUpdateRequest:
      type: object
      description: Manual reconciliation status update. The server derives actor identity and authorized bill visibility; this request must not include money, participant, payer, settlement, file, OCR, auth, session, or storage fields.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/ExpenseBillReconciliationStatus"
        note:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
          description: Optional bounded note or reference label. This note is not copied into audit metadata.
    ExpenseBillReconciliationResponse:
      type: object
      description: Manual reconciliation state for a visible bill. These fields are recordkeeping only and do not represent bill, split, settlement, payer, receipt, OCR, or balance truth.
      required:
        - status
        - updatedAtUtc
        - updatedByUserProfileId
        - reconciledAtUtc
        - note
      properties:
        status:
          $ref: "#/components/schemas/ExpenseBillReconciliationStatus"
        updatedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        updatedByUserProfileId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        reconciledAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        note:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
    ExpenseBillExportResponse:
      type: object
      description: Safe bounded bill export payload derived from authorized visible bills. It contains safe bill-level rows only and excludes auth/session data, payment details, storage/provider internals, raw OCR text, proof bytes, private notes, and unrelated user data.
      required:
        - generatedAtUtc
        - appliedFilters
        - rowCount
        - rows
      properties:
        generatedAtUtc:
          type: string
          format: date-time
        appliedFilters:
          $ref: "#/components/schemas/ExpenseBillExportFilterResponse"
        rowCount:
          type: integer
          minimum: 0
          maximum: 200
        rows:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExpenseBillExportRowResponse"
    ExpenseBillExportFilterResponse:
      type: object
      description: Bounded filters applied to a bill list/export request.
      required:
        - fromDate
        - toDate
        - status
        - reconciliationStatus
        - currency
        - merchant
        - search
        - archiveState
        - limit
      properties:
        fromDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        toDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        status:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillStatus"
            - type: "null"
        reconciliationStatus:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillReconciliationStatus"
            - type: "null"
        currency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        merchant:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
        search:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
        archiveState:
          $ref: "#/components/schemas/ExpenseBillArchiveState"
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ExpenseBillExportRowResponse:
      type: object
      description: Safe bill-level export row. It intentionally omits item names/notes, adjustment notes, payment labels, auth IDs, storage details, OCR text, proof data, and unrelated user data.
      required:
        - billId
        - groupId
        - merchantName
        - billDate
        - billStatus
        - reconciliationStatus
        - totalAmount
        - currency
        - itemCount
        - participantCount
        - payerCount
        - createdAtUtc
        - updatedAtUtc
      properties:
        billId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        billDate:
          type: string
          format: date
        billStatus:
          $ref: "#/components/schemas/ExpenseBillStatus"
        reconciliationStatus:
          $ref: "#/components/schemas/ExpenseBillReconciliationStatus"
        totalAmount:
          type: string
          description: Decimal-safe total amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        itemCount:
          type: integer
          minimum: 0
        participantCount:
          type: integer
          minimum: 0
        payerCount:
          type: integer
          minimum: 0
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    BillCsvImportResponse:
      type: object
      description: Bounded bill CSV import result. Row errors are safe codes/messages and never echo raw CSV cell values. Imported bill summaries expose stable IDs and calculated counts/totals only; merchant names, item names, notes, payment labels, auth/session data, storage internals, OCR text, proof bytes, and raw request bodies are excluded. If errors is non-empty, importedBillCount is 0 and no bills were created.
      required:
        - rowCount
        - importedBillCount
        - rejectedRowCount
        - errors
        - bills
      properties:
        rowCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of non-header CSV data rows accepted for validation.
        importedBillCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of draft bills created by this request. This is zero when any row errors are present.
        rejectedRowCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of CSV data rows rejected by validation. For header-level errors, all data rows are considered rejected.
        errors:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/BillCsvImportRowErrorResponse"
        bills:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BillCsvImportedBillSummaryResponse"
    BillCsvImportRowErrorResponse:
      type: object
      description: Safe CSV import validation error for one row or the header. It contains stable field/code/message data only and does not echo submitted cell values.
      required:
        - rowNumber
        - field
        - code
        - message
      properties:
        rowNumber:
          type: integer
          minimum: 1
          description: One-based CSV row number. Header errors use row 1.
        field:
          type: string
          maxLength: 64
          description: Stable CSV field name or header/body/row.
        code:
          type: string
          maxLength: 80
          description: Stable validation code suitable for client display mapping.
        message:
          type: string
          maxLength: 240
          description: Bounded safe validation message with no raw submitted cell content.
    BillCsvImportedBillSummaryResponse:
      type: object
      description: Safe summary for one imported draft bill. It intentionally excludes raw merchant/item/note text and exposes only IDs, date, status, calculated totals, currency, and bounded counts.
      required:
        - billId
        - groupId
        - billDate
        - status
        - totalAmount
        - totalCurrency
        - itemCount
        - participantCount
        - payerCount
      properties:
        billId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Route group ID for group imports, or null for personal imports.
        billDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        totalAmount:
          type: string
          description: Decimal-safe calculated bill total represented as a string.
        totalCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        itemCount:
          type: integer
          minimum: 1
          maximum: 100
        participantCount:
          type: integer
          minimum: 1
          maximum: 100
        payerCount:
          type: integer
          minimum: 1
          maximum: 100
    ExpenseBillLifecycleResponse:
      type: object
      description: Safe bill archive/restore lifecycle response. It exposes only stable lifecycle fields and excludes merchant text, item names, notes, participant names, payment details, storage internals, file contents, OCR text, raw audit metadata, settlement internals, auth/session data, and unrelated user data.
      required:
        - billId
        - groupId
        - status
        - archiveState
        - archivedAtUtc
        - updatedAtUtc
      properties:
        billId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        archiveState:
          $ref: "#/components/schemas/ExpenseBillArchiveState"
        archivedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        updatedAtUtc:
          type: string
          format: date-time
    PersonalBillListResponse:
      type: object
      description: Personal bills visible to the authenticated actor after bounded filter and limit application.
      required:
        - bills
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillResponse"
    PersonalBillResponse:
      type: object
      description: Safe personal bill response for the authenticated actor. It excludes auth/session/credential data, group membership internals, storage paths, object keys, provider internals, audit metadata, OCR data, and unrelated user data. Adjustment allocations are calculated response data because no adjustment-allocation persistence table exists in the current schema.
      required:
        - id
        - merchantName
        - billDate
        - status
        - reconciliation
        - revisionCreationActions
        - totalAmount
        - totalCurrency
        - createdAtUtc
        - updatedAtUtc
        - items
        - participants
        - payers
        - adjustments
        - calculatedAdjustmentAllocations
      properties:
        id:
          type: string
          format: uuid
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        billDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        reconciliation:
          $ref: "#/components/schemas/ExpenseBillReconciliationResponse"
        revisionCreationActions:
          $ref: "#/components/schemas/BillRevisionCreationActionsResponse"
        totalAmount:
          type: string
          description: Decimal-safe total amount represented as a string.
        totalCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillItemResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillParticipantResponse"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillPayerResponse"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillAdjustmentResponse"
        calculatedAdjustmentAllocations:
          type: array
          description: Calculated adjustment allocation data returned for display/auditability. It is not backed by a dedicated persistence table in this schema slice.
          items:
            $ref: "#/components/schemas/PersonalBillCalculatedAdjustmentAllocationResponse"
    PersonalBillItemResponse:
