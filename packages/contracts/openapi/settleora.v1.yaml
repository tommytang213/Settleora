          description: Bill attachment created for the visible personal bill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillAttachmentResponse"
        "400":
          description: The submitted multipart upload is malformed, unsupported, empty, too large, or has mismatched declared content type and bytes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
