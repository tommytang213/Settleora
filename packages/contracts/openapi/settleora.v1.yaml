      properties:
        applyMode:
          $ref: "#/components/schemas/ReceiptOcrReviewApplyMode"
        expectedReviewUpdatedAtUtc:
          type: string
          format: date-time
          description: The saved review updatedAtUtc value the user previewed or intended to apply.
    ReceiptOcrReviewApplyResponse:
      type: object
      description: Safe receipt OCR review apply result. It exposes bounded IDs, mode, applied item count, currency, reviewed subtotal/grand-total summary, validation issue code arrays, and apply timestamp only. It excludes raw OCR full text, receipt bytes, storage object keys, provider paths, signed URLs, filenames, auth/session data, payment details, raw audit metadata, bill split internals, settlement/payment/balance/residual/proof state, worker state, and unrelated users.
