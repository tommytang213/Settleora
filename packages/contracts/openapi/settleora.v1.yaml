      description: Archives one personal bill by setting its archive timestamp without deleting or mutating money totals, items, splits, participants, payers, adjustments, attachments, OCR reviews, settlement rows, recurring links, or file objects. The authenticated actor must be the bill creator or owner/responsible editor. Repeated archive requests are idempotent and return the current lifecycle state. Visible bills with active linked settlement state return a safe conflict instead of silently mutating settlements.
      operationId: archivePersonalBill
      security:
        - SessionBearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
