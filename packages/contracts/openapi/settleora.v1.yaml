components:
  securitySchemes:
    SessionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  schemas:
    BootstrapStatusResponse:
      type: object
      description: Bounded setup status for first-owner local bootstrap.
      required:
        - bootstrapRequired
      properties:
        bootstrapRequired:
          type: boolean
          description: True only when no auth account exists.
    BootstrapLocalOwnerRequest:
      type: object
      description: First-owner local bootstrap request for a fresh deployment. This is not general public registration.
      additionalProperties: false
      required:
        - identifier
        - password
        - displayName
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Submitted local account identifier, normalized server-side consistently with local sign-in.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 4096
          description: Submitted local account password. The API never stores this plaintext value.
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          description: Initial user profile display name after server-side trimming.
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional initial default currency. Explicit null is accepted.
    BootstrapLocalOwnerResponse:
      type: object
      description: Safe first-owner bootstrap response. It excludes session tokens, password material, credential metadata, provider payloads, audit metadata, storage paths, and unrelated records.
      required:
        - userProfile
        - roles
      properties:
        userProfile:
          $ref: "#/components/schemas/SelfUserProfileResponse"
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
    LocalSignInRequest:
      type: object
      description: Local-account sign-in request. Source, network, actor, account, user, session, refresh, credential, and policy bucket details are derived server-side. Unsupported fields are rejected.
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Submitted local account identifier.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          description: Submitted local account password. The API never stores this plaintext value.
        deviceLabel:
          type: string
          maxLength: 120
          description: Optional display label for the newly created session.
    LocalSignInResponse:
      type: object
      description: Minimal refresh-capable local sign-in success response. Raw credential material is returned only once.
      required:
        - session
        - refreshCredential
      properties:
        session:
          $ref: "#/components/schemas/RefreshSessionAccessSession"
        refreshCredential:
          $ref: "#/components/schemas/RefreshSessionCredential"
    LocalSessionSignInResponse:
      type: object
      description: Local sign-in success response with once-returned raw credential material and bounded current authenticated user metadata. It excludes password material, token hashes, credential IDs, audit internals, provider payloads, and unrelated profiles.
      required:
        - session
        - refreshCredential
        - currentUser
      properties:
        session:
          $ref: "#/components/schemas/RefreshSessionAccessSession"
        refreshCredential:
          $ref: "#/components/schemas/RefreshSessionCredential"
        currentUser:
          $ref: "#/components/schemas/CurrentUserResponse"
    RefreshSessionRequest:
      type: object
      description: Public refresh request. Credential lookup, account, session, session-family, status, expiry, and revocation policy are resolved server-side. Unsupported fields are rejected.
      additionalProperties: false
      required:
        - refreshCredential
      properties:
        refreshCredential:
          type: string
          minLength: 1
          description: Submitted raw refresh-like credential. The API never stores this raw value.
        deviceLabel:
          type: string
          maxLength: 120
          description: Optional display label for the replacement access session.
    RefreshSessionResponse:
      type: object
      description: Minimal refresh success response. Raw credential material is returned only once.
      required:
        - session
        - refreshCredential
      properties:
        session:
          $ref: "#/components/schemas/RefreshSessionAccessSession"
        refreshCredential:
          $ref: "#/components/schemas/RefreshSessionCredential"
    RefreshSessionAccessSession:
      type: object
      description: Replacement opaque access session returned from refresh.
      required:
        - id
        - token
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          minLength: 1
          description: Opaque raw access-session token returned once on refresh success.
        expiresAtUtc:
          type: string
          format: date-time
    RefreshSessionCredential:
      type: object
      description: Replacement refresh-like credential returned from refresh.
      required:
        - token
        - idleExpiresAtUtc
        - absoluteExpiresAtUtc
      properties:
        token:
          type: string
          minLength: 1
          description: Raw refresh-like credential returned once on refresh success.
        idleExpiresAtUtc:
          type: string
          format: date-time
        absoluteExpiresAtUtc:
          type: string
          format: date-time
    CurrentUserResponse:
      type: object
      description: Minimal current authenticated actor, profile, session, and system-role summary.
