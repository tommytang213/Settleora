  /api/v1/sync/operations:
    post:
      summary: Submit server-mode sync operation
      description: Processes one bounded current-actor offline queue operation against the authoritative API. Day 1 supports only bill archive and bill restore for expense bills. The server derives actor, profile, group membership, resource visibility, lifecycle policy, audit, and resulting resource version; the request body is never echoed. Accepted, replayed, rejected, and conflict outcomes are returned as safe sync operation results so clients can preserve local pending work.
      operationId: submitSyncOperation
      security:
        - SessionBearerAuth: []
