    SettlementCandidateListResponse:
      type: object
      description: Bounded read-only settlement candidate previews involving the authenticated actor only. The response excludes full net-position lists, payment details, proof/file internals, auth/session data, request bodies, and unrelated candidate pairs.
      required:
        - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/SettlementCandidateResponse"
    SettlementCandidateResponse:
      type: object
      description: One deterministic settlement candidate derived from a visible confirmed bill where the authenticated actor is the debtor or creditor.
      required:
        - candidateKey
        - sourceExpenseBillId
        - groupId
        - debtorUserProfileId
        - creditorUserProfileId
        - amount
        - currency
        - basis
        - allocationOrder
      properties:
        candidateKey:
          type: string
          minLength: 1
          maxLength: 240
          description: Deterministic server-derived candidate key for this bill/counterparty/amount/currency basis.
        sourceExpenseBillId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Route group ID for group bills; null for personal bills.
        debtorUserProfileId:
          type: string
          format: uuid
        creditorUserProfileId:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal-safe candidate amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        basis:
          type: string
          enum:
            - confirmed_bill_net_position_v1
          description: Server policy basis used to derive the candidate.
        allocationOrder:
          type: integer
          minimum: 0
    CreateSettlementRequestRequest:
      type: object
      description: Minimal settlement request creation body. The candidate key must come from a server-derived candidate preview; all settlement parties, amounts, currency, source bill, group, requester, status, payment details, proof/file IDs, auth account IDs, and session IDs are derived server-side.
      additionalProperties: false
      required:
        - candidateKey
      properties:
        candidateKey:
          type: string
          minLength: 1
          maxLength: 240
          description: Server-derived candidate key from the current confirmed bill candidate basis.
    CreateSettlementBasketRequest:
      type: object
      description: Settlement basket write request for the first same-currency pay-all-outstanding selection mode. The client submits only the counterparty, current-actor direction, optional group scope, currency, and selection mode; source lines, candidate keys, amounts, request parties, requester, status, and audit metadata are always derived server-side at write time.
      additionalProperties: false
      required:
        - counterpartyUserProfileId
        - direction
        - currency
        - selectionMode
      properties:
        counterpartyUserProfileId:
          type: string
          format: uuid
          description: Counterparty profile ID for the current actor's basket creation scope.
        direction:
          $ref: "#/components/schemas/SettlementBalanceDirection"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Optional group scope. Null or omission creates a personal/non-group basket only.
        selectionMode:
          $ref: "#/components/schemas/SettlementBasketSelectionMode"
    SettlementBasketPreviewRequest:
      type: object
      description: Read-only basket preview request for the first same-currency pay-all-outstanding selection mode. The client submits only the counterparty, current-actor direction, optional group scope, currency, and selection mode; candidate lines and amounts are always derived server-side.
      additionalProperties: false
      required:
        - counterpartyUserProfileId
        - direction
        - currency
        - selectionMode
      properties:
        counterpartyUserProfileId:
          type: string
          format: uuid
          description: Counterparty profile ID for the current actor's preview scope.
        direction:
          $ref: "#/components/schemas/SettlementBalanceDirection"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Optional group scope. Null or omission previews personal/non-group candidates only.
        selectionMode:
          $ref: "#/components/schemas/SettlementBasketSelectionMode"
    SettlementBasketPreviewResponse:
      type: object
      description: Bounded read-only settlement basket preview for one current-actor/counterparty direction, optional group, and currency. Amounts are decimal-safe strings; line keys and amounts are server-derived from eligible confirmed bill candidates. The response excludes merchant/item details, payment details, proof/file/storage internals, auth/session data, raw audit metadata, raw request bodies, unrelated users, and receipt/OCR contents.
      required:
        - generatedAtUtc
        - selectionMode
        - direction
        - debtorUserProfileId
        - creditorUserProfileId
        - counterpartyUserProfileId
        - groupId
        - currency
        - exactSelectedTotal
        - lineCount
        - lines
      properties:
        generatedAtUtc:
          type: string
          format: date-time
          description: UTC timestamp when the read-only preview was generated.
        selectionMode:
          $ref: "#/components/schemas/SettlementBasketSelectionMode"
        direction:
          $ref: "#/components/schemas/SettlementBalanceDirection"
        debtorUserProfileId:
          type: string
          format: uuid
        creditorUserProfileId:
          type: string
          format: uuid
        counterpartyUserProfileId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Group scope for group basket previews; null for personal previews.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        exactSelectedTotal:
          type: string
          description: Decimal-safe sum of all selected preview line exact amounts represented as a string.
        lineCount:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBasketPreviewLineResponse"
    SettlementBasketPreviewLineResponse:
      type: object
      description: One bounded server-derived outstanding source line included in a settlement basket preview. It exposes source bill ID, active accepted bill revision trace where available, deterministic candidate key, exact amount/currency, candidate basis, and source bill creation timestamp only.
      required:
        - sourceExpenseBillId
        - sourceBillRevisionId
        - sourceCandidateKey
        - exactAmount
        - currency
        - candidateBasis
        - createdAtUtc
      properties:
        sourceExpenseBillId:
          type: string
          format: uuid
        sourceBillRevisionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Active accepted bill revision ID used by the current bill state when available; otherwise null.
        sourceCandidateKey:
          type: string
          minLength: 1
          maxLength: 240
          description: Deterministic server-derived candidate key for this bill/counterparty/amount/currency basis.
        exactAmount:
          type: string
          description: Decimal-safe exact outstanding amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        candidateBasis:
          type: string
          enum:
            - confirmed_bill_net_position_v1
          description: Server policy basis used to derive the candidate.
        createdAtUtc:
          type: string
          format: date-time
          description: Source bill creation timestamp used for deterministic preview ordering.
    SettlementRequestListResponse:
      type: object
      description: Bounded read-only settlement request list for the authenticated actor. It includes only requests where the actor is debtor, creditor, or requester, includes selected request-line summaries, and excludes payment details, proof/file internals, bill merchant/item details, auth/session data, raw audit metadata, request bodies, and unrelated users.
      required:
        - settlements
      properties:
        settlements:
          type: array
          items:
            $ref: "#/components/schemas/SettlementRequestResponse"
    SettlementRequestResponse:
      type: object
      description: Bounded settlement request response. It exposes request-level fields and selected request-line summaries only, and excludes bill merchant/item details, payment details, proof/file internals, auth/session data, raw audit metadata, unrelated candidates, unrelated users, and raw request bodies.
      required:
        - id
        - sourceExpenseBillId
        - groupId
        - debtorUserProfileId
        - creditorUserProfileId
        - amount
        - currency
        - status
        - requestedByUserProfileId
        - requestedAtUtc
        - createdAtUtc
        - updatedAtUtc
        - lines
      properties:
        id:
          type: string
          format: uuid
        sourceExpenseBillId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Route group ID for group bill settlement requests; null for personal bill settlement requests.
        debtorUserProfileId:
          type: string
          format: uuid
        creditorUserProfileId:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal-safe requested settlement amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        status:
          $ref: "#/components/schemas/SettlementRequestStatus"
        requestedByUserProfileId:
          type: string
          format: uuid
        requestedAtUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        lines:
          type: array
          description: Concrete selected request lines included in this settlement request. Single-bill creation returns one line; basket creation can return multiple server-derived lines ordered by allocation order.
          items:
            $ref: "#/components/schemas/SettlementRequestLineResponse"
    SettlementRequestLineResponse:
      type: object
      description: Bounded settlement request-line summary for the selected concrete bill candidate. It exposes stable source IDs, the already-public candidate key, exact amount/currency, order, status, and timestamps; it excludes bill merchant/item details, payment details, proof/file internals, auth/session data, raw audit metadata, and unrelated users.
      required:
        - id
        - sourceExpenseBillId
        - sourceBillRevisionId
        - sourceCandidateKey
        - exactAmount
        - currency
        - allocationOrder
        - status
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        sourceExpenseBillId:
          type: string
          format: uuid
        sourceBillRevisionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Active accepted bill revision ID used for the selected line when the source bill has one; otherwise null.
        sourceCandidateKey:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 240
            - type: "null"
          description: Server-derived settlement candidate key selected into this request line.
        exactAmount:
          type: string
          description: Decimal-safe exact selected line amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/SettlementRequestLineStatus"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    MonthlyReportResponse:
      type: object
      description: Read-only monthly report summary derived from authorized bill and settlement state. Monetary totals are bucketed by currency and no FX conversion or report-cache write is performed.
      required:
        - month
        - groupId
        - generatedAtUtc
        - billCount
        - totalByCurrency
        - actorShareByCurrency
        - actorPaidByCurrency
        - reconciliationCounts
        - settlementRequestCounts
        - settlementPaymentCounts
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        generatedAtUtc:
          type: string
          format: date-time
        billCount:
          type: integer
          minimum: 0
        totalByCurrency:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyReportCurrencyTotal"
        actorShareByCurrency:
          type: array
          description: Current actor participant-share totals by currency for bills included in the report.
          items:
            $ref: "#/components/schemas/MonthlyReportCurrencyTotal"
        actorPaidByCurrency:
          type: array
          description: Current actor payer contribution totals by currency for bills included in the report.
          items:
            $ref: "#/components/schemas/MonthlyReportCurrencyTotal"
        reconciliationCounts:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyReportStatusCount"
        settlementRequestCounts:
          type: array
          description: Counts by settlement request status for report bills where the current actor is involved in the settlement request.
          items:
            $ref: "#/components/schemas/MonthlyReportStatusCount"
        settlementPaymentCounts:
          type: array
          description: Counts by settlement payment status for report bills where the current actor is involved in the settlement request or payment.
          items:
            $ref: "#/components/schemas/MonthlyReportStatusCount"
    MonthlyReportCurrencyTotal:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        amount:
          type: string
          description: Decimal-safe amount represented as a string.
    MonthlyReportStatusCount:
      type: object
      required:
        - status
        - count
      properties:
        status:
          type: string
          description: Bounded status value for the related count family.
        count:
          type: integer
          minimum: 0
    SettlementBalanceProjectionListResponse:
      type: object
      description: Bounded read-only settlement balance projection list for the authenticated actor. It contains only debtor/creditor balance rows that can be safely rebuilt from settlement request lines and payment allocations, and excludes requester-only records, bill merchant/item details, payment details, proof/file/storage internals, auth/session data, raw audit metadata, raw request bodies, and unrelated users.
      required:
        - generatedAtUtc
        - balances
      properties:
        generatedAtUtc:
          type: string
          format: date-time
          description: UTC timestamp when the projection was generated.
        balances:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBalanceProjectionResponse"
    SettlementBalanceProjectionResponse:
      type: object
      description: One bounded current-actor settlement balance projection row grouped by actor, counterparty, direction, optional group, and currency. Amount fields are decimal-safe strings, active allocation coverage is separated into pending marked-paid claims and confirmed cleared payments, and receiver-confirmed residual effects are exposed without creating or netting a broad credit ledger.
      required:
        - counterpartyUserProfileId
        - groupId
        - direction
        - currency
        - selectedLineAmount
        - pendingClaimedAmount
        - confirmedClearedAmount
        - remainingUnclaimedAmount
        - confirmedRemainingResidualAmount
        - waivedResidualAmount
        - creditResidualAmount
        - requestCount
        - lineCount
        - pendingPaymentCount
        - confirmedPaymentCount
      properties:
        counterpartyUserProfileId:
          type: string
          format: uuid
          description: Debtor or creditor counterparty profile ID for this current-actor balance row.
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
          description: Route group ID for group-scoped settlement balances; null for personal settlement balances.
        direction:
          $ref: "#/components/schemas/SettlementBalanceDirection"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        selectedLineAmount:
          type: string
          description: Decimal-safe selected request-line total amount represented as a string.
        pendingClaimedAmount:
          type: string
          description: Decimal-safe amount represented as a string for allocations from marked_paid payments.
        confirmedClearedAmount:
          type: string
          description: Decimal-safe amount represented as a string for allocations from confirmed payments.
        remainingUnclaimedAmount:
          type: string
          description: Decimal-safe selected line amount minus pending claimed, confirmed cleared, and receiver-confirmed underpayment-waiver amounts, never below zero. Confirmed credit-forward and waived-by-payer overpayment residuals are not netted against unrelated remaining balances.
        confirmedRemainingResidualAmount:
          type: string
          description: Decimal-safe receiver-confirmed underpayment residual amount that remains debt through remaining_balance or carried_forward policy.
        waivedResidualAmount:
          type: string
          description: Decimal-safe receiver-confirmed residual amount waived through underpayment waived or overpayment waived_by_payer policy. Only underpayment waiver reduces remainingUnclaimedAmount for the selected request scope.
        creditResidualAmount:
          type: string
          description: Decimal-safe receiver-confirmed overpayment credit_forward residual amount exposed as bounded residual information without a broad credit ledger or automatic netting against unrelated balances.
        requestCount:
          type: integer
          minimum: 0
          description: Count of settlement requests included in this grouped projection row.
        lineCount:
          type: integer
          minimum: 0
          description: Count of selected settlement request lines included in this grouped projection row.
        pendingPaymentCount:
          type: integer
          minimum: 0
          description: Count of marked_paid payment claims contributing active pending allocation coverage.
        confirmedPaymentCount:
          type: integer
          minimum: 0
          description: Count of confirmed payment claims contributing active cleared allocation coverage.
    CreateSettlementPaymentRequest:
      type: object
      description: Minimal settlement payment claim body. Amount is a decimal-safe string, currency must match the settlement request currency, paymentDate is a yyyy-MM-dd calendar date, and proposedResidualPolicy may be supplied only for explicit non-exact residual proposals. The server derives settlement request, payer/debtor, receiver/creditor, created-by profile, payment status, request status transition, remaining amount, residual direction/status, and partial-vs-covered state; proof files, payment details, payment handles, notes, and auth/session/account identity fields are not accepted.
      additionalProperties: false
      required:
        - amount
        - currency
        - paymentDate
      properties:
        amount:
          type: string
          description: Positive decimal-safe payment amount represented as a string. The API rejects zero, negative values, malformed decimals, unsupported precision, and overpayment unless an explicit supported residual policy is supplied.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        paymentDate:
          type: string
          format: date
          description: Claimed payment date as yyyy-MM-dd.
        proposedResidualPolicy:
          $ref: "#/components/schemas/SettlementResidualPolicy"
    SettlementPaymentListResponse:
      type: object
      description: Bounded read-only settlement payment list for one visible settlement request. It includes only visible payment claims, bounded allocation summaries, and bounded residual summaries, and excludes payment details, payment handles, payment notes, QR data, proof/file/storage internals, bill merchant/item details, auth/session data, raw audit metadata, request bodies, and unrelated users.
      required:
        - payments
      properties:
        payments:
          type: array
          items:
            $ref: "#/components/schemas/SettlementPaymentResponse"
    SettlementPaymentAllocationResponse:
      type: object
      description: Bounded settlement payment allocation summary showing how a payment claim maps to selected settlement request lines. It excludes bill merchant/item details, proof/file/storage internals, payment details, auth/session data, raw audit metadata, private notes, and unrelated users.
      required:
        - id
        - settlementRequestLineId
        - clearedAmount
        - currency
        - allocationOrder
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        settlementRequestLineId:
          type: string
          format: uuid
        clearedAmount:
          type: string
          description: Positive decimal-safe cleared amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        createdAtUtc:
          type: string
          format: date-time
    SettlementPaymentResidualResponse:
      type: object
      description: Bounded settlement residual summary tied to one payment claim. It exposes only stable IDs, direction, amount, currency, policy, status, and lifecycle timestamps, and excludes payment details, proof/file/storage internals, auth/session data, raw request bodies, audit metadata, bill merchant/item details, OCR text, and unrelated users.
      required:
        - id
        - settlementPaymentId
        - settlementRequestId
        - direction
        - amount
        - currency
        - policy
        - status
        - createdAtUtc
      properties:
        id:
          type: string
          format: uuid
        settlementPaymentId:
          type: string
          format: uuid
        settlementRequestId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/SettlementResidualDirection"
        amount:
          type: string
          description: Positive decimal-safe residual amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        policy:
          $ref: "#/components/schemas/SettlementResidualPolicy"
        status:
          $ref: "#/components/schemas/SettlementResidualStatus"
        createdAtUtc:
          type: string
          format: date-time
        resolvedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    SettlementPaymentResponse:
      type: object
      description: Bounded settlement payment response for payment read, claim, confirmation, dispute, and cancellation surfaces. It exposes payment fields, bounded allocation summaries, bounded residual summaries, and resulting settlement request status only, and excludes payment details, payment handles, payment notes, QR data, proof/file/storage internals, auth/session/credential/token data, raw request bodies, bill merchant/item details, OCR text, and unrelated users.
      required:
        - paymentId
        - settlementRequestId
        - paidByUserProfileId
        - receivedByUserProfileId
        - amount
        - currency
        - status
        - paymentDate
        - claimedAtUtc
        - createdAtUtc
        - updatedAtUtc
        - allocations
        - residuals
        - settlementRequestStatus
      properties:
        paymentId:
          type: string
          format: uuid
        settlementRequestId:
          type: string
          format: uuid
        paidByUserProfileId:
          type: string
          format: uuid
        receivedByUserProfileId:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal-safe payment amount represented as a string.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        status:
          $ref: "#/components/schemas/SettlementPaymentStatus"
        paymentDate:
          type: string
          format: date
        claimedAtUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/SettlementPaymentAllocationResponse"
        residuals:
          type: array
          items:
            $ref: "#/components/schemas/SettlementPaymentResidualResponse"
        settlementRequestStatus:
          $ref: "#/components/schemas/SettlementRequestStatus"
    BillAttachmentListResponse:
      type: object
      description: Safe bill attachment metadata list. It excludes file bytes, storage object keys, storage paths, provider URLs, direct URLs, vault references, original filenames, auth/session data, bill merchant/item details, raw audit metadata, OCR text, and unrelated users.
      required:
        - attachments
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/BillAttachmentResponse"
    BillAttachmentResponse:
      type: object
      description: Safe bill attachment file metadata. It exposes stable file and bill IDs plus bounded purpose and content metadata only, and never contains storage object keys, storage paths, provider URLs, direct URLs, vault references, original filenames, bytes, thumbnails, OCR text, raw audit metadata, or unrelated user data.
      required:
        - fileId
        - billId
        - purpose
        - contentType
        - sizeBytes
        - uploadedAtUtc
        - updatedAtUtc
      properties:
        fileId:
          type: string
          format: uuid
          description: Stable file metadata identifier for the attachment.
        billId:
          type: string
          format: uuid
          description: Expense bill ID that owns this attachment association.
        purpose:
          type: string
          enum:
            - receipt
            - supporting_attachment
          description: Bounded bill attachment purpose stored on the bill association.
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        uploadedAtUtc:
          type: string
          format: date-time
          description: Timestamp when the bill attachment association was created.
        updatedAtUtc:
          type: string
          format: date-time
          description: Timestamp when the underlying file metadata was last updated.
    AttachBillAttachmentRequest:
      type: object
      description: Multipart form used to upload one personal or group bill attachment file. The purpose must be receipt or supporting_attachment. Receipt uploads accept PNG, JPEG, and WEBP. Supporting attachments accept PNG, JPEG, WEBP, and PDF. The filename is treated as submitted transport metadata only and is not persisted into attachment responses or audit metadata.
      additionalProperties: false
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          maxLength: 5242880
          description: Bill attachment file. The maximum accepted file size is 5 MB.
        purpose:
          type: string
          enum:
            - receipt
            - supporting_attachment
          description: Bounded bill attachment purpose for the file association.
    ReceiptOcrReviewStatus:
      type: string
      description: Minimal provisional review state for client/on-device or user-reviewed receipt OCR data.
      enum:
        - provisional
        - reviewed
    ReceiptOcrReviewSource:
      type: string
      description: Bounded source category for submitted receipt OCR review data.
      enum:
        - on_device
        - manual_entry
        - imported_reviewed_data
    ReceiptOcrCandidateAmount:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,4})?$"
      maxLength: 22
      description: Decimal-safe non-negative candidate amount represented as a string. Exponent notation, locale formatting, symbols, and floating-point JSON numbers are not accepted.
      examples:
        - "12.34"
    ReceiptOcrReviewLineRequest:
      type: object
      description: One bounded OCR review line. Line text is reviewed/candidate text, not raw OCR full text. Amounts use the review-level currency and remain provisional.
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 240
          description: Reviewed or candidate receipt line text.
        quantity:
          oneOf:
            - type: string
              pattern: "^(?=.*[1-9])(?:0|[0-9]+)(?:\\.[0-9]{1,4})?$"
              maxLength: 22
            - type: "null"
          description: Optional positive decimal quantity candidate represented as a string.
        unitPriceAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
          description: Optional non-negative unit price candidate represented as a string.
        lineTotalAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
          description: Optional non-negative line total candidate represented as a string.
    ReceiptOcrReviewUpsertRequest:
      type: object
      description: Purpose-specific review/intake payload for one existing bill receipt attachment. It stores provisional OCR-derived or manually reviewed candidate fields only and must not include raw OCR full text, file bytes, storage/provider fields, auth/session fields, bill item mutation instructions, split allocation inputs, settlement data, payment details, or unrelated user data.
      additionalProperties: false
      required:
        - status
        - source
      properties:
        status:
          $ref: "#/components/schemas/ReceiptOcrReviewStatus"
        source:
          $ref: "#/components/schemas/ReceiptOcrReviewSource"
        merchantText:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
          description: Optional reviewed or candidate merchant text. It is bounded review data, not raw OCR full text.
        receiptIssuedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Optional candidate receipt date/time.
        currency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional review-level currency. Required when any amount candidate is supplied.
        subtotalAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
        taxAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
        serviceChargeAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
        discountAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
          description: Optional non-negative discount magnitude candidate. It is not a signed authoritative adjustment.
        grandTotalAmount:
          oneOf:
            - $ref: "#/components/schemas/ReceiptOcrCandidateAmount"
            - type: "null"
        lines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewLineRequest"
          description: Optional bounded review lines. The server derives stable line order from array order.
    ReceiptOcrReviewLineResponse:
      type: object
      description: Safe receipt OCR review line response. It exposes bounded reviewed/candidate fields only and excludes raw OCR full text, file bytes, storage/provider internals, bill item mutation state, payment details, and unrelated users.
      required:
        - id
        - sortOrder
        - text
        - quantity
        - unitPriceAmount
        - lineTotalAmount
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        sortOrder:
          type: integer
          minimum: 0
        text:
          type: string
          maxLength: 240
        quantity:
          oneOf:
            - type: string
            - type: "null"
        unitPriceAmount:
          oneOf:
            - type: string
            - type: "null"
        lineTotalAmount:
          oneOf:
            - type: string
            - type: "null"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    ReceiptOcrReviewListResponse:
      type: object
      description: Safe receipt OCR review queue list. It contains compact navigation summaries only and excludes raw OCR full text, receipt bytes, storage object keys, provider paths, signed URLs, filenames, auth/session data, payment details, raw audit metadata, bill item/split/settlement/balance state, and unrelated users.
      required:
        - reviews
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewSummaryResponse"
    ReceiptOcrReviewSummaryResponse:
      type: object
      description: Compact safe receipt OCR review summary for review queue navigation. It exposes stable review, bill, group, and file IDs plus bounded review status/source, optional reviewed merchant text/currency, line count, and timestamps only.
      required:
        - reviewId
        - billId
        - groupId
        - fileId
        - status
        - source
        - merchantText
