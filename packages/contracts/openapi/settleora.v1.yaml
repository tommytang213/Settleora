  /api/v1/recurring-bills/{templateId}/occurrences/{occurrenceDate}/generate-draft:
    post:
      summary: Generate recurring bill draft
      description: Generates one draft expense bill for a visible active recurring template occurrence after explicit user action. The server revalidates current actor access, group membership, schedule membership, template payload, money, currency, participants, and payer policy at write time. Repeating the same template and occurrence date returns the existing generated draft instead of creating duplicate money records.
      operationId: generateRecurringBillDraft
      security:
        - SessionBearerAuth: []
