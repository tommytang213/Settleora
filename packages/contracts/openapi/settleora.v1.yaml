          description: Sync operation was processed into an accepted, replayed, rejected, or conflict result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOperationResponse"
        "400":
          description: Sync operation envelope is invalid or outside the Day 1 resource boundary.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to submit a sync operation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Sync operation persistence failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
