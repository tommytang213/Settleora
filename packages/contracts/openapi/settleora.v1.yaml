      additionalProperties: false
      properties:
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: Optional merchant or template display name after server-side trimming.
        description:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional bounded template description. Audit metadata does not log this text.
