        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Bill is missing, a group bill, unrelated, not creator/owner-accessible, deleted through its profile relationship, or unavailable to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bill archive is blocked by visible lifecycle or active settlement state.
          content:
