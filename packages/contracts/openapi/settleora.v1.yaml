        - blockedReasons
        - warnings
        - appliedAtUtc
      properties:
        reviewId:
          type: string
          format: uuid
        billId:
          type: string
          format: uuid
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        fileId:
          type: string
          format: uuid
        applyMode:
          $ref: "#/components/schemas/ReceiptOcrReviewApplyMode"
        appliedItemCount:
          type: integer
          minimum: 0
          maximum: 100
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        subtotalAmount:
          oneOf:
            - type: string
            - type: "null"
        grandTotalAmount:
          oneOf:
            - type: string
            - type: "null"
        summary:
          $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewSummaryResponse"
        blockedReasons:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewIssueCode"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptOcrReviewApplyPreviewIssueCode"
        appliedAtUtc:
          type: string
          format: date-time
    SettlementPaymentProofListResponse:
      type: object
      description: Safe settlement payment proof metadata list. It excludes proof bytes, storage object keys, storage paths, provider URLs, direct URLs, vault references, original filenames, auth/session data, payment handles, payment notes, bill merchant/item details, raw audit metadata, and unrelated users.
      required:
        - proofs
      properties:
        proofs:
          type: array
          items:
            $ref: "#/components/schemas/SettlementPaymentProofResponse"
    SettlementPaymentProofResponse:
      type: object
      description: Safe settlement payment proof file metadata. It exposes stable file and payment IDs plus content metadata only, and never contains storage object keys, storage paths, provider URLs, direct URLs, vault references, original filenames, bytes, thumbnails, OCR text, or raw audit metadata.
      required:
        - fileId
        - settlementPaymentId
        - contentType
        - sizeBytes
        - uploadedAtUtc
        - updatedAtUtc
      properties:
        fileId:
          type: string
          format: uuid
          description: Stable file metadata identifier for the proof attachment.
        settlementPaymentId:
          type: string
          format: uuid
          description: Settlement payment claim ID that owns this proof association.
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        uploadedAtUtc:
          type: string
          format: date-time
          description: Timestamp when the proof association was created.
        updatedAtUtc:
          type: string
          format: date-time
          description: Timestamp when the underlying file metadata was last updated.
    AttachSettlementPaymentProofRequest:
      type: object
      description: Multipart form used to upload one settlement payment proof file. The filename is treated as submitted transport metadata only and is not persisted into proof responses or audit metadata.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          maxLength: 5242880
          description: Settlement proof file. Allowed content types are image/png, image/jpeg, image/webp, and application/pdf; the maximum accepted file size is 5 MB.
    CreateGroupBillRequest:
      type: object
      description: Minimal group bill creation request. Creator/current actor are derived server-side; the route groupId is authoritative and clients cannot submit creator, owner, auth account, session, group override, file, or authorization identity fields.
      additionalProperties: false
      required:
        - billDate
        - currency
        - items
      properties:
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: Optional merchant name after server-side trimming.
        billDate:
          type: string
          format: date
          description: Bill date as yyyy-MM-dd.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateGroupBillItemRequest"
        adjustments:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreateGroupBillAdjustmentRequest"
            - type: "null"
          description: Optional adjustments. Manual allocation is intentionally excluded from this first group bill endpoint slice.
        payers:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreateGroupBillPayerRequest"
            - type: "null"
          description: Optional payer rows. When omitted, null, or empty, the authenticated actor is the sole payer for the calculated bill total.
    CreateGroupBillItemRequest:
      type: object
      description: Group bill item. Splits are required and every split userProfileId must belong to an active member of the route group.
      additionalProperties: false
      required:
        - name
        - amount
        - splits
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
          description: Item name after server-side trimming.
        note:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional item note after server-side trimming.
        amount:
          type: string
          description: Decimal-safe item amount represented as a string.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        splits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateGroupBillItemSplitRequest"
    CreateGroupBillItemSplitRequest:
      type: object
      description: Group bill item split. exact_amount, percentage, ratio, and share_weight require basisValue; equal split does not.
      additionalProperties: false
      required:
        - userProfileId
        - splitMethod
      properties:
        userProfileId:
          type: string
          format: uuid
          description: User profile ID for an active member of the route group.
        splitMethod:
          $ref: "#/components/schemas/ExpenseBillItemSplitMethod"
        basisValue:
          oneOf:
            - type: string
            - type: "null"
          description: Decimal-safe split basis represented as a string where required by splitMethod.
        allocationOrder:
          type: integer
          minimum: 0
          description: Optional allocation order. When omitted, input order is used.
    CreateGroupBillAdjustmentRequest:
      type: object
      description: Optional group bill adjustment. Manual allocation is intentionally excluded from this first endpoint slice.
      additionalProperties: false
      required:
        - type
        - direction
        - allocationMethod
        - amount
      properties:
        type:
          $ref: "#/components/schemas/ExpenseBillAdjustmentType"
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/GroupBillAdjustmentAllocationMethod"
        amount:
          type: string
          description: Decimal-safe adjustment amount represented as a string.
          examples:
            - "1.23"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        reasonNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional adjustment reason note after server-side trimming.
    CreateGroupBillPayerRequest:
      type: object
      description: Optional group bill payer row. Every userProfileId must belong to an active member of the route group, and supplied payer totals must match the calculated bill total.
      additionalProperties: false
      required:
        - userProfileId
        - amount
      properties:
        userProfileId:
          type: string
          format: uuid
          description: User profile ID for an active member of the route group.
        amount:
          type: string
          description: Decimal-safe payer amount represented as a string.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        paymentMethodLabelSnapshot:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Optional payment method label snapshot after server-side trimming.
    GroupBillListResponse:
      type: object
      description: Group bills visible to the authenticated active group member after bounded filter and limit application.
      required:
        - bills
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillResponse"
    GroupBillResponse:
      type: object
      description: Safe group bill response for the authenticated active group member. It excludes auth/session/credential data, group membership internals beyond submitted bill participants, storage paths, object keys, provider internals, audit metadata, OCR data, and unrelated user data. Adjustment allocations are calculated response data because no adjustment-allocation persistence table exists in the current schema.
      required:
        - id
        - groupId
        - merchantName
        - billDate
        - status
        - reconciliation
        - revisionCreationActions
        - totalAmount
        - totalCurrency
        - createdAtUtc
        - updatedAtUtc
        - items
        - participants
        - payers
        - adjustments
        - calculatedAdjustmentAllocations
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        billDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        reconciliation:
          $ref: "#/components/schemas/ExpenseBillReconciliationResponse"
        revisionCreationActions:
          $ref: "#/components/schemas/BillRevisionCreationActionsResponse"
        totalAmount:
          type: string
          description: Decimal-safe total amount represented as a string.
        totalCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillItemResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillParticipantResponse"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillPayerResponse"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillAdjustmentResponse"
        calculatedAdjustmentAllocations:
          type: array
          description: Calculated adjustment allocation data returned for display/auditability. It is not backed by a dedicated persistence table in this schema slice.
          items:
            $ref: "#/components/schemas/GroupBillCalculatedAdjustmentAllocationResponse"
    GroupBillItemResponse:
      type: object
