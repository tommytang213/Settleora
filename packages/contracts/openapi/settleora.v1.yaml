        - authAccountId
        - userProfile
        - session
        - roles
      properties:
        authAccountId:
          type: string
          format: uuid
        userProfile:
          $ref: "#/components/schemas/CurrentUserProfile"
        session:
          $ref: "#/components/schemas/CurrentUserSession"
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
          uniqueItems: true
    CurrentUserProfile:
      type: object
      description: Linked active user profile summary for the authenticated account.
      required:
        - id
        - displayName
        - defaultCurrency
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
    CurrentUserSession:
      type: object
      description: Validated current session summary.
      required:
        - id
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        expiresAtUtc:
          type: string
          format: date-time
    InAppNotificationListResponse:
      type: object
      description: Bounded current-user in-app notification list. It excludes recipient and actor user profile IDs, auth/session/account data, payment details, storage/file internals, OCR text, and unrelated user data.
      required:
        - notifications
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/InAppNotificationResponse"
    InAppNotificationSummaryResponse:
      type: object
      description: Current-user unread notification counts. Archived notifications are excluded.
      required:
        - unreadCount
        - attentionCount
        - urgentCount
      properties:
        unreadCount:
          type: integer
          minimum: 0
        attentionCount:
          type: integer
          minimum: 0
        urgentCount:
          type: integer
          minimum: 0
    InAppNotificationResponse:
      type: object
      description: Safe current-user notification response. It exposes stable event/status/template keys and route-like action URLs only; it never exposes recipient/actor user profile IDs, auth/session/account fields, payment handles/notes, storage provider data, file paths, raw OCR text, proof bytes, or unrelated user data.
      required:
        - id
        - eventType
        - status
        - priority
        - subjectType
        - titleKey
        - messageKey
        - safeSummary
        - actionUrl
        - groupId
        - expenseBillId
        - expenseBillRevisionId
        - settlementRequestId
        - settlementPaymentId
        - recurringBillTemplateId
        - recurringBillOccurrenceId
        - createdAtUtc
        - readAtUtc
        - archivedAtUtc
      properties:
        id:
          type: string
          format: uuid
        eventType:
          $ref: "#/components/schemas/InAppNotificationEventType"
        status:
          $ref: "#/components/schemas/InAppNotificationStatus"
        priority:
          $ref: "#/components/schemas/InAppNotificationPriority"
        subjectType:
          $ref: "#/components/schemas/InAppNotificationSubjectType"
        titleKey:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable localization/template key for the title.
        messageKey:
          type: string
          minLength: 1
          maxLength: 120
          description: Stable localization/template key for the message.
        safeSummary:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 240
            - type: "null"
          description: Optional bounded non-sensitive summary.
        actionUrl:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 240
              pattern: "^/api/v1/"
            - type: "null"
          description: Optional route-like API path. Clients must still re-authorize linked subject reads.
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        expenseBillId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        expenseBillRevisionId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        settlementRequestId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        settlementPaymentId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        recurringBillTemplateId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        recurringBillOccurrenceId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        createdAtUtc:
          type: string
          format: date-time
        readAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        archivedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    CreateLocalUserRequest:
      type: object
