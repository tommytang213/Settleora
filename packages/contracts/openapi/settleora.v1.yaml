openapi: 3.1.0
info:
  title: Settleora API
  version: 0.1.0
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0
  description: >
    OpenAPI contract for Settleora scaffold materialization. Generated mobile
    and web clients are produced from this file, and generated output
    must not be manually edited. This contract currently covers scaffold health
    checks, first-owner local bootstrap status/creation for fresh deployments,
    refresh-capable local sign-in, public refresh, current-session sign-out,
    current-account sign-out-all, current-account session list and per-session
    revocation, the minimal current-user auth read boundary, and guarded
    self-profile read/update endpoints, first personal and group bill create/read
    endpoints, bill submission and participant acknowledgement/rejection workflow endpoints,
    first bill revision proposal lifecycle endpoints, settlement candidate preview, first settlement request creation endpoints,
    settlement request list/get endpoints, settlement counterparty payment-details
    read endpoints, settlement-scoped counterparty payment QR content reads,
    settlement payment claim endpoints, receiver settlement payment confirmation endpoints,
    settlement dispute endpoints, settlement cancellation endpoints, settlement payment proof attach/list/content/remove endpoints,
    recurring bill template and forecast/draft-generation endpoints,
    guarded current-user in-app notification inbox endpoints,
    personal and group bill attachment attach/list/content/remove endpoints, and settlement balance projection read endpoints,
    guarded group create/list/read/update and group member-management foundations
    plus guarded admin local-user list/read/create foundations; it is not the feature contract for
    general public registration, invitations, auth middleware, session management beyond
    current-session sign-out, current-account sign-out-all/list/revocation, and
    public refresh, broader user management, role assignment, group invitations,
    guest members, sync,
    OCR upload, UI behavior, or database behavior.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      description: Placeholder health endpoint for future API availability checks.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /health/ready:
    get:
      summary: Readiness check
      description: Checks PostgreSQL, RabbitMQ, and storage connectivity without exposing dependency details.
      operationId: getHealthReady
      security: []
      responses:
        "200":
          description: Service is ready for requests that require PostgreSQL, RabbitMQ, and storage connectivity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                    example: ready
                  service:
                    type: string
                    example: settleora-api
                  checks:
                    type: object
                    required:
                      - postgres
                      - rabbitmq
                      - storage
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                        example: ok
                      rabbitmq:
                        type: string
                        enum:
                          - ok
                        example: ok
                      storage:
                        type: string
                        enum:
                          - ok
                        example: ok
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Service is not ready because PostgreSQL, RabbitMQ, or storage connectivity is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - unready
                    example: unready
                  service:
                    type: string
                    example: settleora-api
                  checks:
                    type: object
                    required:
                      - postgres
                      - rabbitmq
                      - storage
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
                      rabbitmq:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
                      storage:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/bootstrap/status:
    get:
      summary: Bootstrap status
      description: Returns only whether first-owner local bootstrap is required because no auth account exists.
      operationId: getAuthBootstrapStatus
      security: []
      responses:
        "200":
          description: Bounded bootstrap setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatusResponse"
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/bootstrap/local-owner:
    post:
      summary: Bootstrap first local owner
      description: Creates the first local owner account only while no auth account exists. This is not general public registration; clients must sign in normally after bootstrap succeeds.
      operationId: bootstrapLocalOwner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapLocalOwnerRequest"
      responses:
        "200":
          description: Local owner bootstrap succeeded without returning credential or token material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapLocalOwnerResponse"
        "400":
          description: The submitted bootstrap request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bootstrap is unavailable because an auth account already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Bootstrap could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-in:
    post:
      summary: Local sign-in
      description: Authenticates a local account with an identifier and password, returning a refresh-capable opaque access session plus initial refresh-like credential only once on success. Source, actor, session, refresh, credential, and policy identifiers are resolved server-side; unsupported request fields are rejected.
      operationId: signInLocal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSignInRequest"
      responses:
        "200":
          description: Local sign-in succeeded and returned new credential material once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSignInResponse"
        "400":
          description: Request contains unsupported fields.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Sign-in failed without revealing account, credential, or policy state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Too many sign-in attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/local/sign-in:
    post:
      summary: Local session sign-in
      description: Authenticates a local account with an identifier and password, returning a refresh-capable opaque access session plus bounded current authenticated user/profile/session metadata. Source, actor, session, refresh, credential, and policy identifiers are resolved server-side; unsupported request fields are rejected.
      operationId: signInLocalSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSignInRequest"
      responses:
        "200":
          description: Local sign-in succeeded and returned new credential material plus current user metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSessionSignInResponse"
        "400":
          description: Request contains unsupported fields.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Sign-in failed without revealing account, credential, or policy state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Too many sign-in attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/refresh:
    post:
      summary: Refresh session
      description: Rotates a submitted refresh-like credential and returns a new opaque access-session token plus replacement refresh-like credential only on success. Credential lookup, account, session, session-family, status, expiry, and revocation policy are resolved server-side; unsupported request fields are rejected.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Refresh succeeded and returned replacement credential material once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResponse"
        "400":
          description: Request contains unsupported fields.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Refresh failed without revealing credential, account, session, or family state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Refresh could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-out:
    post:
      summary: Current session sign-out
      description: Validates the submitted opaque bearer session token and revokes only that current session. The current bearer session is authoritative; this endpoint does not accept a request body.
      operationId: signOutCurrentSession
      security:
        - SessionBearerAuth: []
      responses:
        "204":
          description: Current session was revoked. No response body is returned.
        "400":
          description: Request body is not accepted for this action.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-out-all:
    post:
      summary: Current account sign-out-all
      description: Validates the submitted opaque bearer session token and revokes all active sessions owned by the authenticated account, including the submitted current session. The current bearer actor/account is authoritative; this endpoint does not accept a request body.
      operationId: signOutAllCurrentAccountSessions
      security:
        - SessionBearerAuth: []
      responses:
        "204":
          description: Active sessions for the current account were revoked. No response body is returned.
        "400":
          description: Request body is not accepted for this action.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Sign-out-all failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sessions:
    get:
      summary: Current account sessions
      description: Validates the submitted opaque bearer session token and lists safe metadata for active sessions owned by the authenticated account. The current bearer actor/account is authoritative; client-submitted account or user identifiers are not accepted.
      operationId: listCurrentAccountSessions
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Active sessions owned by the authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      summary: Revoke current account session
      description: Validates the submitted opaque bearer session token and revokes one route-identified session owned by the authenticated account. The route session ID and current bearer actor/account are authoritative; this endpoint does not accept a request body.
      operationId: revokeCurrentAccountSession
      security:
        - SessionBearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Authoritative route session ID to revoke for the authenticated account.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session was revoked. No response body is returned.
        "400":
          description: Request body is not accepted for this action.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Requested session is unavailable to revoke.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/current-user:
    get:
      summary: Current authenticated user
      description: Validates an opaque bearer session token and returns the minimal authenticated actor, profile, session, and system-role summary derived from the current bearer session.
      operationId: getCurrentUser
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Current authenticated user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/me:
    get:
      summary: Current authenticated session
      description: Validates an opaque bearer session token and returns the minimal authenticated actor, profile, session, and system-role summary derived from the current bearer session.
      operationId: getAuthenticatedSession
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Current authenticated user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users:
    get:
      summary: List admin users
      description: Lists safe user summaries for non-deleted profiles/accounts. Requires an authenticated SettleoraSession with system owner or admin role; ordinary users are forbidden. This is not public registration or invitation management.
      operationId: listAdminUsers
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Safe admin user summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users/local:
    post:
      summary: Create admin local user
      description: Creates a normal local-account user through an authenticated owner/admin path. The API derives the actor server-side, assigns only the system user role, and returns no session tokens, password material, credential metadata, provider payloads, audit metadata, storage paths, or invitation state. This is not public self-registration.
      operationId: createAdminLocalUser
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalUserRequest"
      responses:
        "201":
          description: Local user was created with the default system user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummaryResponse"
        "400":
          description: The submitted local-user creation request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: A local user cannot be created with the submitted information.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Local user creation could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users/{userProfileId}:
    get:
      summary: Get admin user
      description: Returns one safe user summary for a non-deleted profile/account. Requires an authenticated SettleoraSession with system owner or admin role; ordinary users are forbidden.
      operationId: getAdminUser
      security:
        - SessionBearerAuth: []
      parameters:
        - name: userProfileId
          in: path
          required: true
          description: User profile ID to read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe admin user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummaryResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User profile or auth account is missing, deleted, or unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills:
    post:
      summary: Create personal bill
      description: Creates a draft personal bill for the authenticated actor. The API derives the creator, participant, and payer from the current session, keeps groupId null, calculates totals and resolved shares server-side, and rejects client-submitted ownership, participant, payer, group, file, or authorization IDs.
      operationId: createPersonalBill
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalBillRequest"
      responses:
        "201":
          description: Personal draft bill created for the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBillResponse"
        "400":
          description: The submitted personal bill request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Personal bill creation could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      summary: List personal bills
      description: Lists active personal bills visible to the authenticated actor where groupId is null by default. Supports bounded read-only filters for bill date, bill status, manual reconciliation status, currency, merchant text, safe bill-field search, explicit archive visibility, and result limit.
      operationId: listPersonalBills
      security:
        - SessionBearerAuth: []
      parameters:
        - name: fromDate
          in: query
          required: false
          description: Optional inclusive bill date lower bound as yyyy-MM-dd.
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          description: Optional inclusive bill date upper bound as yyyy-MM-dd.
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          description: Optional expense bill status filter.
          schema:
            $ref: "#/components/schemas/ExpenseBillStatus"
        - name: reconciliationStatus
          in: query
          required: false
          description: Optional manual reconciliation status filter.
          schema:
            $ref: "#/components/schemas/ExpenseBillReconciliationStatus"
        - name: currency
          in: query
          required: false
          description: Optional uppercase supported three-letter currency filter.
          schema:
            $ref: "#/components/schemas/CurrencyCode"
        - name: merchant
          in: query
          required: false
          description: Optional bounded contains-style merchant filter.
          schema:
            type: string
            maxLength: 120
        - name: search
          in: query
          required: false
          description: Optional bounded search over authorized bill merchant, item name, item note, and adjustment reason note fields.
          schema:
            type: string
            maxLength: 120
        - name: archiveState
          in: query
          required: false
          description: Optional archive visibility filter. Defaults to active, which excludes archived bills from ordinary list results.
          schema:
            $ref: "#/components/schemas/ExpenseBillArchiveState"
        - name: limit
          in: query
          required: false
          description: Optional bounded result limit. Defaults to 50 and may not exceed 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Personal bills visible to the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBillListResponse"
        "400":
          description: The submitted bill list filter is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills/import.csv:
    post:
      summary: Import personal bill drafts from CSV
      description: Imports a bounded UTF-8 text/csv body into one or more personal draft bills for the authenticated actor. Rows are grouped by clientBillKey, creator/owner/participant/payer identity is derived or checked against the current actor, bill totals and splits are calculated server-side, and invalid rows return a safe all-or-nothing result without storing partial bills. The clientBillKey is a request-local grouping key only; Day 1 import does not provide durable idempotency or duplicate suppression across repeated uploads. Raw CSV, item notes, auth/session data, storage details, payment details, OCR text, and file/proof contents are never returned.
      operationId: importPersonalBillsCsv
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              maxLength: 65536
              description: UTF-8 CSV body with header columns clientBillKey, merchantName, billDate, currency, itemName, itemAmount, itemNote, payerUserProfileId, splitUserProfileId, splitMethod, and splitBasisValue. Optional personal payer/split profile IDs must match the authenticated actor.
      responses:
        "200":
          description: Import result. If row errors are present, no bills were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillCsvImportResponse"
        "400":
