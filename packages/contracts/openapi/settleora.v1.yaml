  /api/v1/groups/{groupId}/bills/{billId}/attachments/{fileId}/content:
    get:
      summary: Read group bill attachment content
      description: Streams one active group bill attachment through API authorization every time. The authenticated actor must have active route-group access and be related to the bill as creator, owner/responsible editor, participant, or payer. The linked file must be active, owned and created by the attachment creator, have the expected bill attachment purpose, and use an allowed content type. The response uses conservative content headers and never exposes storage object keys, provider paths, provider URLs, original filenames, auth/session fields, OCR text, thumbnails, or unrelated data.
      operationId: getGroupBillAttachmentContent
      security:
        - SessionBearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID that owns the bill.
          schema:
            type: string
            format: uuid
        - name: billId
          in: path
          required: true
          description: Group bill ID whose attachment content should be read.
          schema:
            type: string
            format: uuid
        - name: fileId
          in: path
          required: true
          description: Stable file object ID to stream.
          schema:
            type: string
            format: uuid
