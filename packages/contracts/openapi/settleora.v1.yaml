    ManualFinanceSummaryResponse:
      type: object
      description: Server-owned read-only manual finance availability projection for the authenticated actor. Amounts are decimal-safe strings and remain grouped by currency without conversion.
      required:
        - asOfUtc
        - windowStartDate
        - windowEndDate
        - currencies
        - warnings
      properties:
        asOfUtc:
          type: string
          format: date-time
        windowStartDate:
          type: string
          format: date
        windowEndDate:
          type: string
          format: date
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/ManualFinanceSummaryCurrencyRow"
        warnings:
          type: array
          description: Stable limitation flags for this projection.
          items:
            type: string
    ManualFinanceSummaryCurrencyRow:
      type: object
      description: One per-currency availability row. Values are not converted or mixed across currencies.
      required:
        - currency
        - activeManualAccountBalanceTotal
        - expectedManualIncomeTotal
        - recurringExpectedManualIncomeTotal
        - upcomingOneTimeFutureBillObligationTotal
        - groupOneTimeFutureBillObligationTotal
        - recurringObligationEstimateTotal
        - groupRecurringObligationEstimateTotal
        - estimatedAvailableAmount
        - warnings
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        activeManualAccountBalanceTotal:
          type: string
          description: Sum of active, non-archived manual account balance snapshots for this currency.
        expectedManualIncomeTotal:
          type: string
          description: Sum of active, non-archived one-time manual income rows expected in the window for this currency.
        recurringExpectedManualIncomeTotal:
          type: string
          description: Sum of active, non-archived recurring manual income occurrences projected safely inside the window for this currency.
        upcomingOneTimeFutureBillObligationTotal:
          type: string
          description: Sum of current actor personal one-time future bill draft/pending obligations in the window for this currency, excluding archived/cancelled rows.
        groupOneTimeFutureBillObligationTotal:
          type: string
          description: Sum of current actor resolved shares from visible group one-time future bill draft/pending obligations in the window for this currency, excluding archived/cancelled rows and unsupported actor-share cases.
        recurringObligationEstimateTotal:
          type: string
          description: Sum of active, non-archived personal recurring bill template forecast occurrences projected inside the window for this currency.
        groupRecurringObligationEstimateTotal:
          type: string
          description: Sum of current actor resolved shares from visible active, non-archived group recurring bill template occurrences projected inside the window for this currency, excluding unsupported actor-share cases.
        estimatedAvailableAmount:
          type: string
          description: activeManualAccountBalanceTotal plus expectedManualIncomeTotal plus recurringExpectedManualIncomeTotal minus personal and group future-bill and recurring-obligation totals in this row.
        warnings:
          type: array
          description: Stable per-row limitation flags.
          items:
            type: string
