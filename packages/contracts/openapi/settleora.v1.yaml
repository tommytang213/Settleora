    delete:
      summary: Remove self payment QR
      description: Clears the authenticated actor's own payment QR link and marks the previously linked file deleted through the internal lifecycle foundation. Missing QR state is idempotent and does not expose unrelated state.
      operationId: removeSelfPaymentQr
      security:
        - SessionBearerAuth: []
      responses:
        "204":
          description: The self payment QR link is absent after the request.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Payment QR removal could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/users/me/payment-details/qr/content:
    get:
      summary: Read self payment QR content
      description: Returns bytes for the authenticated actor's own active linked payment QR only. The endpoint validates the current actor, payment-details authorization, file purpose, owner, creator, lifecycle state, and content type before opening storage.
      operationId: getSelfPaymentQrContent
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Self payment QR image bytes.
          headers:
            X-Content-Type-Options:
              schema:
                type: string
              description: Set to nosniff.
            Content-Disposition:
              schema:
                type: string
              description: Conservative attachment disposition with no submitted filename.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile or payment QR is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/users/me/profile:
    get:
      summary: Self user profile
      description: Returns the authenticated actor's own active profile through the server-side business authorization boundary.
      operationId: getSelfUserProfile
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfUserProfileResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      summary: Update self user profile
      description: Updates safe fields on the authenticated actor's own active profile through the server-side business authorization boundary.
      operationId: updateSelfUserProfile
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfUserProfileRequest"
      responses:
        "200":
          description: Updated authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfUserProfileResponse"
        "400":
          description: The submitted profile update is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  securitySchemes:
    SessionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  schemas:
    BootstrapStatusResponse:
      type: object
      description: Bounded setup status for first-owner local bootstrap.
      required:
        - bootstrapRequired
      properties:
        bootstrapRequired:
          type: boolean
          description: True only when no auth account exists.
    BootstrapLocalOwnerRequest:
      type: object
      description: First-owner local bootstrap request for a fresh deployment. This is not general public registration.
      additionalProperties: false
      required:
        - identifier
        - password
        - displayName
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Submitted local account identifier, normalized server-side consistently with local sign-in.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 4096
          description: Submitted local account password. The API never stores this plaintext value.
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          description: Initial user profile display name after server-side trimming.
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional initial default currency. Explicit null is accepted.
    BootstrapLocalOwnerResponse:
      type: object
      description: Safe first-owner bootstrap response. It excludes session tokens, password material, credential metadata, provider payloads, audit metadata, storage paths, and unrelated records.
      required:
        - userProfile
        - roles
      properties:
        userProfile:
          $ref: "#/components/schemas/SelfUserProfileResponse"
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
    LocalSignInRequest:
      type: object
      description: Local-account sign-in request. Source, network, and policy bucket details are derived server-side.
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Submitted local account identifier.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          description: Submitted local account password. The API never stores this plaintext value.
        deviceLabel:
          type: string
          maxLength: 120
          description: Optional display label for the newly created session.
    LocalSignInResponse:
      type: object
      description: Minimal refresh-capable local sign-in success response. Raw credential material is returned only once.
      required:
        - session
        - refreshCredential
      properties:
        session:
          $ref: "#/components/schemas/RefreshSessionAccessSession"
        refreshCredential:
          $ref: "#/components/schemas/RefreshSessionCredential"
    RefreshSessionRequest:
      type: object
      description: Public refresh request. Credential lookup, account, session-family, status, expiry, and revocation policy are resolved server-side.
      additionalProperties: false
      required:
        - refreshCredential
      properties:
        refreshCredential:
          type: string
          minLength: 1
          description: Submitted raw refresh-like credential. The API never stores this raw value.
        deviceLabel:
          type: string
          maxLength: 120
          description: Optional display label for the replacement access session.
    RefreshSessionResponse:
      type: object
      description: Minimal refresh success response. Raw credential material is returned only once.
      required:
        - session
        - refreshCredential
      properties:
        session:
          $ref: "#/components/schemas/RefreshSessionAccessSession"
        refreshCredential:
          $ref: "#/components/schemas/RefreshSessionCredential"
    RefreshSessionAccessSession:
      type: object
      description: Replacement opaque access session returned from refresh.
      required:
        - id
        - token
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          minLength: 1
          description: Opaque raw access-session token returned once on refresh success.
        expiresAtUtc:
          type: string
          format: date-time
    RefreshSessionCredential:
      type: object
      description: Replacement refresh-like credential returned from refresh.
      required:
        - token
        - idleExpiresAtUtc
        - absoluteExpiresAtUtc
      properties:
        token:
          type: string
          minLength: 1
          description: Raw refresh-like credential returned once on refresh success.
        idleExpiresAtUtc:
          type: string
          format: date-time
        absoluteExpiresAtUtc:
          type: string
          format: date-time
    CurrentUserResponse:
      type: object
      description: Minimal current authenticated actor, profile, session, and system-role summary.
      required:
        - authAccountId
        - userProfile
        - session
        - roles
      properties:
        authAccountId:
          type: string
          format: uuid
        userProfile:
          $ref: "#/components/schemas/CurrentUserProfile"
        session:
          $ref: "#/components/schemas/CurrentUserSession"
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
          uniqueItems: true
    CurrentUserProfile:
      type: object
      description: Linked active user profile summary for the authenticated account.
      required:
        - id
        - displayName
        - defaultCurrency
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
    CurrentUserSession:
      type: object
      description: Validated current session summary.
      required:
        - id
        - expiresAtUtc
      properties:
        id:
          type: string
          format: uuid
        expiresAtUtc:
          type: string
          format: date-time
    CreateLocalUserRequest:
      type: object
      description: Authenticated owner/admin local-user creation request. The server derives the actor and assigns only the default system user role.
      additionalProperties: false
      required:
        - identifier
        - password
        - displayName
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: Submitted local account identifier, normalized server-side consistently with local sign-in and first-owner bootstrap.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 4096
          description: Submitted local account password. The API never stores this plaintext value.
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          description: Initial user profile display name after server-side trimming.
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional initial default currency. Explicit null is accepted.
    AdminUserListResponse:
      type: object
      description: Safe admin user list response for owner/admin user-management foundations.
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummaryResponse"
    AdminUserSummaryResponse:
      type: object
      description: Safe admin user summary. It excludes identifiers, password material, credential metadata, session/token material, refresh credential material, provider payloads, audit metadata, storage paths, and unrelated records.
      required:
        - userProfileId
        - authAccountId
        - displayName
        - defaultCurrency
        - accountStatus
        - roles
        - createdAtUtc
        - updatedAtUtc
      properties:
        userProfileId:
          type: string
          format: uuid
        authAccountId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        accountStatus:
          type: string
          enum:
            - active
            - disabled
        roles:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
          uniqueItems: true
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    CreateGroupRequest:
      type: object
      description: Group creation request. Creator and owner membership are derived from the authenticated actor.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Group name after server-side trimming. Blank or whitespace-only values are rejected.
    UpdateGroupRequest:
      type: object
      description: Group settings update. Only the name can be updated in this foundation endpoint.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: Group name after server-side trimming. Blank or whitespace-only values are rejected.
    GroupListResponse:
      type: object
      description: Groups where the authenticated actor has active membership. This foundation response is intentionally unpaginated for now.
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupResponse"
    GroupResponse:
      type: object
      description: Safe group summary for the authenticated actor. It excludes creator profile IDs, unrelated members, auth/session/credential data, provider payloads, audit metadata, storage paths, and group policy internals.
      required:
        - id
        - name
        - currentUserRole
        - currentUserStatus
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        currentUserRole:
          $ref: "#/components/schemas/GroupRole"
        currentUserStatus:
          $ref: "#/components/schemas/GroupMembershipStatus"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    AddGroupMemberRequest:
      type: object
      description: Adds an existing active registered user profile to a group. Role defaults to member when omitted; clients cannot submit actor IDs, auth account IDs, owner IDs, or authorization context.
      additionalProperties: false
      required:
        - userProfileId
      properties:
        userProfileId:
          type: string
          format: uuid
          description: Existing active user profile with an active auth account.
        role:
          $ref: "#/components/schemas/GroupRole"
    UpdateGroupMemberRequest:
      type: object
      description: Updates the group role for an existing active group membership. The route userProfileId identifies the member; body userProfileId fields are rejected.
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/GroupRole"
    GroupMemberListResponse:
      type: object
      description: Active registered group members visible to the authenticated actor.
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
    GroupMemberResponse:
      type: object
      description: Safe group member summary. It excludes auth account IDs, identifiers, credentials, sessions, token material, provider payloads, audit metadata, storage paths, removed memberships, and unrelated users.
      required:
        - userProfileId
        - displayName
        - role
        - status
        - joinedAtUtc
        - updatedAtUtc
      properties:
        userProfileId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        role:
          $ref: "#/components/schemas/GroupRole"
        status:
          $ref: "#/components/schemas/GroupMembershipStatus"
        joinedAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    GroupRole:
      type: string
      description: Group-scoped role.
      enum:
        - owner
        - member
    GroupMembershipStatus:
      type: string
      description: Group membership status.
      enum:
        - active
        - removed
    CreatePersonalBillRequest:
      type: object
      description: Minimal personal bill creation request. Creator, group, participant, payer, profile, account, file, and authorization identity are derived server-side and cannot be submitted by clients.
      additionalProperties: false
      required:
        - billDate
        - currency
        - items
      properties:
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: Optional merchant name after server-side trimming.
        billDate:
          type: string
          format: date
          description: Bill date as yyyy-MM-dd.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreatePersonalBillItemRequest"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/CreatePersonalBillAdjustmentRequest"
        payerPaymentMethodLabelSnapshot:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Optional payment method label snapshot for the actor payer row after server-side trimming.
    CreatePersonalBillItemRequest:
      type: object
      description: Personal bill item. The service creates exactly one exact-amount split for the authenticated actor.
      additionalProperties: false
      required:
        - name
        - amount
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
          description: Item name after server-side trimming.
        note:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional item note after server-side trimming.
        amount:
          type: string
          description: Decimal-safe item amount represented as a string.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    CreatePersonalBillAdjustmentRequest:
      type: object
      description: Optional personal bill adjustment. Manual allocation is intentionally excluded from this first endpoint slice.
      additionalProperties: false
      required:
        - type
        - direction
        - allocationMethod
        - amount
      properties:
        type:
          $ref: "#/components/schemas/ExpenseBillAdjustmentType"
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/PersonalBillAdjustmentAllocationMethod"
        amount:
          type: string
          description: Decimal-safe adjustment amount represented as a string.
          examples:
            - "1.23"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        reasonNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional adjustment reason note after server-side trimming.
    RejectBillParticipantRequest:
      type: object
      description: Bounded participant rejection request. Free-text rejection notes are intentionally excluded from this slice.
      additionalProperties: false
      required:
        - reasonCode
      properties:
        reasonCode:
          $ref: "#/components/schemas/ExpenseBillParticipantRejectionReasonCode"
    PersonalBillListResponse:
      type: object
      description: Personal bills visible to the authenticated actor. This first foundation response is intentionally unpaginated.
      required:
        - bills
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillResponse"
    PersonalBillResponse:
      type: object
      description: Safe personal bill response for the authenticated actor. It excludes auth/session/credential data, group membership internals, storage paths, object keys, provider internals, audit metadata, OCR data, and unrelated user data. Adjustment allocations are calculated response data because no adjustment-allocation persistence table exists in the current schema.
      required:
        - id
        - merchantName
        - billDate
        - status
        - totalAmount
        - totalCurrency
        - createdAtUtc
        - updatedAtUtc
        - items
        - participants
        - payers
        - adjustments
        - calculatedAdjustmentAllocations
      properties:
        id:
          type: string
          format: uuid
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        billDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        totalAmount:
          type: string
          description: Decimal-safe total amount represented as a string.
        totalCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillItemResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillParticipantResponse"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillPayerResponse"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillAdjustmentResponse"
        calculatedAdjustmentAllocations:
          type: array
          description: Calculated adjustment allocation data returned for display/auditability. It is not backed by a dedicated persistence table in this schema slice.
          items:
            $ref: "#/components/schemas/PersonalBillCalculatedAdjustmentAllocationResponse"
    PersonalBillItemResponse:
      type: object
      required:
        - id
        - name
        - note
        - amount
        - currency
        - sortOrder
        - splits
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 240
        note:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        sortOrder:
          type: integer
          minimum: 0
        splits:
          type: array
          items:
            $ref: "#/components/schemas/PersonalBillItemSplitResponse"
    PersonalBillItemSplitResponse:
      type: object
      required:
        - userProfileId
        - splitMethod
        - basisValue
        - resolvedAmount
        - resolvedCurrency
        - allocationOrder
        - receivedResidualMinorUnit
      properties:
        userProfileId:
          type: string
          format: uuid
        splitMethod:
          $ref: "#/components/schemas/ExpenseBillItemSplitMethod"
        basisValue:
          oneOf:
            - type: string
            - type: "null"
        resolvedAmount:
          type: string
        resolvedCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        receivedResidualMinorUnit:
          type: boolean
    PersonalBillParticipantResponse:
      type: object
      required:
        - userProfileId
        - status
        - resolvedShareAmount
        - resolvedShareCurrency
        - rejectionReasonCode
      properties:
        userProfileId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ExpenseBillParticipantStatus"
        resolvedShareAmount:
          type: string
        resolvedShareCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        rejectionReasonCode:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillParticipantRejectionReasonCode"
            - type: "null"
          description: Bounded rejection reason code when the participant rejected the bill; null otherwise.
    PersonalBillPayerResponse:
      type: object
      required:
        - userProfileId
        - amount
        - currency
        - paymentMethodLabelSnapshot
      properties:
        userProfileId:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        paymentMethodLabelSnapshot:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
    PersonalBillAdjustmentResponse:
      type: object
      required:
        - id
        - type
        - direction
        - allocationMethod
        - amount
        - currency
        - reasonNote
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ExpenseBillAdjustmentType"
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/PersonalBillAdjustmentAllocationMethod"
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        reasonNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
        sortOrder:
          type: integer
          minimum: 0
    PersonalBillCalculatedAdjustmentAllocationResponse:
      type: object
      required:
        - expenseBillAdjustmentId
        - userProfileId
        - direction
        - allocationMethod
        - allocatedAmount
        - currency
        - allocationOrder
        - receivedResidualMinorUnit
      properties:
        expenseBillAdjustmentId:
          type: string
          format: uuid
        userProfileId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/PersonalBillAdjustmentAllocationMethod"
        allocatedAmount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        receivedResidualMinorUnit:
          type: boolean
    CreateGroupBillRequest:
      type: object
      description: Minimal group bill creation request. Creator/current actor are derived server-side; the route groupId is authoritative and clients cannot submit creator, owner, auth account, session, group override, file, or authorization identity fields.
      additionalProperties: false
      required:
        - billDate
        - currency
        - items
      properties:
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: Optional merchant name after server-side trimming.
        billDate:
          type: string
          format: date
          description: Bill date as yyyy-MM-dd.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateGroupBillItemRequest"
        adjustments:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreateGroupBillAdjustmentRequest"
            - type: "null"
          description: Optional adjustments. Manual allocation is intentionally excluded from this first group bill endpoint slice.
        payers:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CreateGroupBillPayerRequest"
            - type: "null"
          description: Optional payer rows. When omitted, null, or empty, the authenticated actor is the sole payer for the calculated bill total.
    CreateGroupBillItemRequest:
      type: object
      description: Group bill item. Splits are required and every split userProfileId must belong to an active member of the route group.
      additionalProperties: false
      required:
        - name
        - amount
        - splits
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 240
          description: Item name after server-side trimming.
        note:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional item note after server-side trimming.
        amount:
          type: string
          description: Decimal-safe item amount represented as a string.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        splits:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateGroupBillItemSplitRequest"
    CreateGroupBillItemSplitRequest:
      type: object
      description: Group bill item split. exact_amount, percentage, ratio, and share_weight require basisValue; equal split does not.
      additionalProperties: false
      required:
        - userProfileId
        - splitMethod
      properties:
        userProfileId:
          type: string
          format: uuid
          description: User profile ID for an active member of the route group.
        splitMethod:
          $ref: "#/components/schemas/ExpenseBillItemSplitMethod"
        basisValue:
          oneOf:
            - type: string
            - type: "null"
          description: Decimal-safe split basis represented as a string where required by splitMethod.
        allocationOrder:
          type: integer
          minimum: 0
          description: Optional allocation order. When omitted, input order is used.
    CreateGroupBillAdjustmentRequest:
      type: object
      description: Optional group bill adjustment. Manual allocation is intentionally excluded from this first endpoint slice.
      additionalProperties: false
      required:
        - type
        - direction
        - allocationMethod
        - amount
      properties:
        type:
          $ref: "#/components/schemas/ExpenseBillAdjustmentType"
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/GroupBillAdjustmentAllocationMethod"
        amount:
          type: string
          description: Decimal-safe adjustment amount represented as a string.
          examples:
            - "1.23"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        reasonNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional adjustment reason note after server-side trimming.
    CreateGroupBillPayerRequest:
      type: object
      description: Optional group bill payer row. Every userProfileId must belong to an active member of the route group, and supplied payer totals must match the calculated bill total.
      additionalProperties: false
      required:
        - userProfileId
        - amount
      properties:
        userProfileId:
          type: string
          format: uuid
          description: User profile ID for an active member of the route group.
        amount:
          type: string
          description: Decimal-safe payer amount represented as a string.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        paymentMethodLabelSnapshot:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Optional payment method label snapshot after server-side trimming.
    GroupBillListResponse:
      type: object
      description: Group bills visible to the authenticated active group member. This first foundation response is intentionally unpaginated.
      required:
        - bills
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillResponse"
    GroupBillResponse:
      type: object
      description: Safe group bill response for the authenticated active group member. It excludes auth/session/credential data, group membership internals beyond submitted bill participants, storage paths, object keys, provider internals, audit metadata, OCR data, and unrelated user data. Adjustment allocations are calculated response data because no adjustment-allocation persistence table exists in the current schema.
      required:
        - id
        - groupId
        - merchantName
        - billDate
        - status
        - totalAmount
        - totalCurrency
        - createdAtUtc
        - updatedAtUtc
        - items
        - participants
        - payers
        - adjustments
        - calculatedAdjustmentAllocations
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        merchantName:
          oneOf:
            - type: string
              maxLength: 200
            - type: "null"
        billDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/ExpenseBillStatus"
        totalAmount:
          type: string
          description: Decimal-safe total amount represented as a string.
        totalCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillItemResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillParticipantResponse"
        payers:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillPayerResponse"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillAdjustmentResponse"
        calculatedAdjustmentAllocations:
          type: array
          description: Calculated adjustment allocation data returned for display/auditability. It is not backed by a dedicated persistence table in this schema slice.
          items:
            $ref: "#/components/schemas/GroupBillCalculatedAdjustmentAllocationResponse"
    GroupBillItemResponse:
      type: object
      required:
        - id
        - name
        - note
        - amount
        - currency
        - sortOrder
        - splits
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 240
        note:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        sortOrder:
          type: integer
          minimum: 0
        splits:
          type: array
          items:
            $ref: "#/components/schemas/GroupBillItemSplitResponse"
    GroupBillItemSplitResponse:
      type: object
      required:
        - userProfileId
        - splitMethod
        - basisValue
        - resolvedAmount
        - resolvedCurrency
        - allocationOrder
        - receivedResidualMinorUnit
      properties:
        userProfileId:
          type: string
          format: uuid
        splitMethod:
          $ref: "#/components/schemas/ExpenseBillItemSplitMethod"
        basisValue:
          oneOf:
            - type: string
            - type: "null"
        resolvedAmount:
          type: string
        resolvedCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        receivedResidualMinorUnit:
          type: boolean
    GroupBillParticipantResponse:
      type: object
      required:
        - userProfileId
        - status
        - resolvedShareAmount
        - resolvedShareCurrency
        - rejectionReasonCode
      properties:
        userProfileId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ExpenseBillParticipantStatus"
        resolvedShareAmount:
          type: string
        resolvedShareCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        rejectionReasonCode:
          oneOf:
            - $ref: "#/components/schemas/ExpenseBillParticipantRejectionReasonCode"
            - type: "null"
          description: Bounded rejection reason code when the participant rejected the bill; null otherwise.
    GroupBillPayerResponse:
      type: object
      required:
        - userProfileId
        - amount
        - currency
        - paymentMethodLabelSnapshot
      properties:
        userProfileId:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        paymentMethodLabelSnapshot:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
    GroupBillAdjustmentResponse:
      type: object
      required:
        - id
        - type
        - direction
        - allocationMethod
        - amount
        - currency
        - reasonNote
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ExpenseBillAdjustmentType"
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/GroupBillAdjustmentAllocationMethod"
        amount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        reasonNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
        sortOrder:
          type: integer
          minimum: 0
    GroupBillCalculatedAdjustmentAllocationResponse:
      type: object
      required:
        - expenseBillAdjustmentId
        - userProfileId
        - direction
        - allocationMethod
        - allocatedAmount
        - currency
        - allocationOrder
        - receivedResidualMinorUnit
      properties:
        expenseBillAdjustmentId:
          type: string
          format: uuid
        userProfileId:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/ExpenseBillAdjustmentDirection"
        allocationMethod:
          $ref: "#/components/schemas/GroupBillAdjustmentAllocationMethod"
        allocatedAmount:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        allocationOrder:
          type: integer
          minimum: 0
        receivedResidualMinorUnit:
          type: boolean
    ExpenseBillStatus:
      type: string
      description: Expense bill root status.
      enum:
        - draft
        - pending_confirmation
        - confirmed
        - rejected
        - cancelled
        - finalized
        - archived
    ExpenseBillParticipantStatus:
      type: string
      description: Expense bill participant status.
      enum:
        - pending_acceptance
        - accepted
        - rejected
        - partially_settled
        - settled
        - waived
        - claimed_paid
        - confirmed_paid
    ExpenseBillParticipantRejectionReasonCode:
      type: string
      description: Bounded participant rejection reason code.
      enum:
        - wrong_amount
        - wrong_items
        - wrong_split
        - duplicate
        - not_mine
        - other
    ExpenseBillItemSplitMethod:
      type: string
      description: Expense bill item split method.
      enum:
        - equal
        - exact_amount
        - percentage
        - ratio
        - share_weight
    ExpenseBillAdjustmentType:
      type: string
      description: Expense bill adjustment type.
      enum:
        - tax
        - service_charge
        - discount
        - manual_adjustment
        - credit
    ExpenseBillAdjustmentDirection:
      type: string
      description: Expense bill adjustment direction.
      enum:
        - charge
        - credit
    PersonalBillAdjustmentAllocationMethod:
      type: string
      description: Supported adjustment allocation methods for the first personal bill endpoint slice.
      enum:
        - equal
        - proportional_by_item_subtotal
    GroupBillAdjustmentAllocationMethod:
      type: string
      description: Supported non-manual adjustment allocation methods for the first group bill endpoint slice.
      enum:
        - equal
        - proportional_by_item_subtotal
    PaymentDetailsVisibility:
      type: string
      description: Payment details visibility policy value. The default app behavior is settlement_counterparties_only.
      enum:
        - private
        - settlement_counterparties_only
        - group_members_when_shared
    SelfPaymentDetailsResponse:
      type: object
      description: Safe self payment-details response for the authenticated actor. It excludes auth account IDs, session IDs, credential state, audit metadata, counterparty data, storage object keys, storage paths, provider URLs, vault internals, and submitted filenames.
      required:
        - isConfigured
        - id
        - preferredMethodLabel
        - paymentHandle
        - paymentNote
        - visibility
        - qrFile
        - createdAtUtc
        - updatedAtUtc
      properties:
        isConfigured:
          type: boolean
          description: True only when an active payment profile row exists for the authenticated actor.
        id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        preferredMethodLabel:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
        paymentHandle:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 320
            - type: "null"
        paymentNote:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1000
            - type: "null"
        visibility:
          $ref: "#/components/schemas/PaymentDetailsVisibility"
        qrFile:
          oneOf:
            - $ref: "#/components/schemas/SelfPaymentDetailsQrFileResponse"
            - type: "null"
          description: Safe metadata for the active linked payment QR file, or null when no active QR is linked.
        createdAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        updatedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    SelfPaymentDetailsQrFileResponse:
      type: object
      description: Safe self payment QR file metadata. It never contains storage object keys, storage paths, provider URLs, vault references, bytes, thumbnails, direct URLs, or submitted filenames.
      required:
        - id
        - contentType
        - sizeBytes
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
          description: Stable file metadata identifier for the linked QR file.
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        updatedAtUtc:
          type: string
          format: date-time
    AttachSelfPaymentQrRequest:
      type: object
      description: Multipart form used to upload a single self payment QR image. The filename is treated as submitted transport metadata only and is not returned by the API.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Payment QR image. Allowed content types are image/png, image/jpeg, and image/webp; the maximum accepted file size is 2 MB.
    UpdateSelfPaymentDetailsRequest:
      type: object
      description: Safe self payment-details update. Missing text fields are preserved on update, explicit null clears them, whitespace-only text normalizes to null, and omitted visibility defaults only when creating a new payment profile.
      additionalProperties: false
      minProperties: 1
      properties:
        preferredMethodLabel:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Optional payment method label after server-side trimming.
        paymentHandle:
          oneOf:
            - type: string
              maxLength: 320
            - type: "null"
          description: Optional user-entered payment handle after server-side trimming.
        paymentNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional user-entered payment note after server-side trimming.
        visibility:
          $ref: "#/components/schemas/PaymentDetailsVisibility"
    SelfUserProfileResponse:
      type: object
      description: Safe self-profile response for the authenticated actor.
      required:
        - id
        - displayName
        - defaultCurrency
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    UpdateSelfUserProfileRequest:
      type: object
      description: Safe self-profile update. Profile identity is derived from the authenticated actor, not from client input.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          description: Display name after server-side trimming. Blank or whitespace-only values are rejected.
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional default currency. Explicit null clears the value.
    SessionListResponse:
      type: object
      description: Safe active session metadata for the authenticated account. The list is capped by the API.
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionSummary"
    SessionSummary:
      type: object
      description: Bounded session metadata that excludes token material, hashes, network data, user-agent data, and revocation details.
      required:
        - id
        - isCurrent
        - status
        - issuedAtUtc
        - expiresAtUtc
        - lastSeenAtUtc
        - deviceLabel
      properties:
        id:
          type: string
          format: uuid
        isCurrent:
          type: boolean
        status:
          type: string
          enum:
            - active
        issuedAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
        lastSeenAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        deviceLabel:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO-4217 style currency code.
      examples:
        - USD
    Money:
      type: object
      description: Decimal-safe money value with an attached currency.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal-safe amount represented as a string to avoid floating point loss.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    RoundingMode:
      type: string
      description: Placeholder rounding modes for future policy-driven money handling.
      enum:
        - up
        - down
        - nearest
        - bankers
    SyncState:
      type: string
      description: Placeholder sync state values shared by local and server-mode clients.
      enum:
        - queued
        - synced
        - conflict
        - failed
    StorageObjectRef:
      type: object
      description: Stable storage object reference that does not expose physical filesystem paths.
      required:
        - id
      properties:
        id:
          type: string
          description: Opaque storage object identifier.
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
    ProblemDetails:
      type: object
      description: RFC 7807 / RFC 9457 style problem response.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    OcrJobStatus:
      type: string
      description: Placeholder OCR job status values for future worker contract design.
      enum:
        - queued
        - processing
        - completed
        - failed
