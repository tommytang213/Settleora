        - settlement.request_cancelled
        - settlement.payment_cancelled
        - settlement.proof_attached
        - recurring_bill.draft_generated
    InAppNotificationStatus:
      type: string
      description: Current lifecycle state for an in-app notification.
      enum:
        - unread
        - read
        - archived
    InAppNotificationPriority:
      type: string
      description: Bounded in-app notification priority for inbox presentation.
      enum:
        - normal
        - attention
        - urgent
    InAppNotificationSubjectType:
      type: string
      description: Stable subject family linked by optional IDs on a notification.
      enum:
        - expense_bill
        - settlement_request
        - settlement_payment
        - recurring_bill_occurrence
    ExpenseBillArchiveState:
      type: string
      description: Bounded archive visibility filter or lifecycle state for expense bills.
      enum:
        - active
        - archived
        - all
    ManualFinancialAccountType:
      type: string
      description: User-owned manual account category for cash visibility.
      enum:
        - cash
        - bank_account
        - stored_value
        - other
    ManualFinancialAccountStatus:
      type: string
      description: Manual financial account lifecycle status.
      enum:
        - active
        - archived
    ManualIncomeCadence:
      type: string
      description: Manual expected cash-in cadence.
      enum:
        - one_time
        - weekly
        - biweekly
        - monthly
        - quarterly
        - yearly
    ManualIncomeSourceStatus:
      type: string
      description: Manual expected cash-in lifecycle status.
      enum:
        - active
        - archived
    ExpenseBillStatus:
      type: string
      description: Expense bill root status.
      enum:
        - draft
        - pending_confirmation
        - confirmed
        - rejected
        - cancelled
        - finalized
        - archived
    ExpenseBillReconciliationStatus:
      type: string
      description: Manual bill reconciliation status. This is a recordkeeping label only and does not change financial truth, bill totals, split shares, settlement state, payer state, files, or OCR state.
      enum:
        - unreconciled
        - reconciled
        - ignored
    ExpenseBillParticipantStatus:
      type: string
      description: Expense bill participant status.
      enum:
        - pending_acceptance
        - accepted
        - rejected
        - partially_settled
        - settled
        - waived
        - claimed_paid
        - confirmed_paid
    ExpenseBillRevisionStatus:
      type: string
      description: Bill revision proposal lifecycle status.
      enum:
        - draft_revision
        - submitted_for_review
        - withdrawn_by_proposer
        - superseded_by_resubmission
        - rejected
        - accepted_applied
        - cancelled_by_authorized_editor
    ExpenseBillRevisionApprovalStatus:
      type: string
      description: Bill revision approval status.
      enum:
        - pending_review
        - approved
        - rejected
        - invalidated_by_supersession
    ExpenseBillPayerConfirmationStatus:
      type: string
      description: Payer confirmation status for original bill payer facts and proposed revision payer facts.
      enum:
        - pending_confirmation
        - confirmed
        - rejected
    ExpenseBillParticipantRejectionReasonCode:
      type: string
      description: Bounded participant rejection reason code.
      enum:
        - wrong_amount
        - wrong_items
        - wrong_split
        - duplicate
        - not_mine
        - other
    ExpenseBillItemSplitMethod:
      type: string
      description: Expense bill item split method.
      enum:
        - equal
        - exact_amount
        - percentage
        - ratio
        - share_weight
    ExpenseBillAdjustmentType:
      type: string
      description: Expense bill adjustment type.
      enum:
        - tax
        - service_charge
        - discount
        - manual_adjustment
        - credit
    ExpenseBillAdjustmentDirection:
      type: string
      description: Expense bill adjustment direction.
      enum:
        - charge
        - credit
    PersonalBillAdjustmentAllocationMethod:
      type: string
      description: Supported adjustment allocation methods for the first personal bill endpoint slice.
      enum:
        - equal
        - proportional_by_item_subtotal
    GroupBillAdjustmentAllocationMethod:
      type: string
      description: Supported non-manual adjustment allocation methods for the first group bill endpoint slice.
      enum:
        - equal
        - proportional_by_item_subtotal
    SettlementRequestStatus:
      type: string
      description: Settlement request status returned by settlement request surfaces.
      enum:
        - requested
        - partially_paid
        - marked_paid
        - confirmed
        - disputed
        - cancelled
    SettlementRequestLineStatus:
      type: string
      description: Settlement request-line status returned by settlement request surfaces.
      enum:
        - open
        - partially_cleared
        - cleared
        - waived
        - disputed
        - cancelled
    SettlementBalanceDirection:
      type: string
      description: Direction of a settlement balance projection from the authenticated actor's perspective.
      enum:
        - incoming
        - outgoing
    SettlementBasketSelectionMode:
      type: string
      description: Supported settlement basket selection mode for the first preview and create slices.
      enum:
        - pay_all_outstanding_for_counterparty
    SettlementPaymentStatus:
      type: string
      description: Settlement payment status returned by settlement payment surfaces. Day 1 payment claim creates marked_paid payments, receiver confirmation moves them to confirmed, receiver dispute moves eligible marked_paid claims to disputed, and debtor cancellation moves eligible own marked_paid claims to cancelled.
      enum:
        - marked_paid
        - confirmed
        - disputed
        - cancelled
    SettlementResidualDirection:
      type: string
      description: Direction of a proposed settlement residual relative to the exact selected outstanding total.
      enum:
        - underpayment
        - overpayment
    SettlementResidualPolicy:
      type: string
      description: Supported residual policy values for explicit payment-claim-time residual proposals.
      enum:
        - remaining_balance
        - carried_forward
        - waived
        - credit_forward
        - waived_by_payer
        - applied_to_other_line
    SettlementResidualStatus:
      type: string
      description: Settlement residual status returned by payment response summaries. Payment claims create pending residuals, receiver residual confirmation moves supported pending residuals to policy-derived confirmed, carried_forward, waived, or credited statuses, and dispute/cancellation neutralizes pending residuals to disputed or cancelled.
      enum:
        - pending_receiver_confirmation
        - confirmed
        - carried_forward
        - waived
        - credited
        - disputed
        - cancelled
    PaymentDetailsVisibility:
      type: string
      description: Payment details visibility policy value. The default app behavior is settlement_counterparties_only.
      enum:
        - private
        - settlement_counterparties_only
        - group_members_when_shared
    SelfPaymentDetailsResponse:
      type: object
      description: Safe self payment-details response for the authenticated actor. It excludes auth account IDs, session IDs, credential state, audit metadata, counterparty data, storage object keys, storage paths, provider URLs, vault internals, and submitted filenames.
      required:
        - isConfigured
        - id
        - preferredMethodLabel
        - paymentHandle
        - paymentNote
        - visibility
        - qrFile
        - createdAtUtc
        - updatedAtUtc
      properties:
        isConfigured:
          type: boolean
          description: True only when an active payment profile row exists for the authenticated actor.
        id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        preferredMethodLabel:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
        paymentHandle:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 320
            - type: "null"
        paymentNote:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1000
            - type: "null"
        visibility:
          $ref: "#/components/schemas/PaymentDetailsVisibility"
        qrFile:
          oneOf:
            - $ref: "#/components/schemas/SelfPaymentDetailsQrFileResponse"
            - type: "null"
          description: Safe metadata for the active linked payment QR file, or null when no active QR is linked.
        createdAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        updatedAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    SelfPaymentDetailsQrFileResponse:
      type: object
      description: Safe self payment QR file metadata. It never contains storage object keys, storage paths, provider URLs, vault references, bytes, thumbnails, direct URLs, or submitted filenames.
      required:
        - id
        - contentType
        - sizeBytes
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
          description: Stable file metadata identifier for the linked QR file.
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        updatedAtUtc:
          type: string
          format: date-time
    SettlementCounterpartyPaymentDetailsResponse:
      type: object
      description: Safe settlement-scoped counterparty payment-details response. It is not the self owner response and excludes payment profile IDs, owner-only timestamps, auth/session/credential data, audit internals, storage object keys, storage paths, provider URLs, vault internals, QR bytes, direct URLs, filenames, and unrelated users.
      required:
        - userProfileId
        - isConfigured
        - preferredMethodLabel
        - paymentHandle
        - paymentNote
        - visibilityApplied
        - qrFile
      properties:
        userProfileId:
          type: string
          format: uuid
          description: Target counterparty user profile ID proven through the settlement request relationship.
        isConfigured:
          type: boolean
          description: True only when an active target payment profile is visible through the settlement counterparty relationship.
        preferredMethodLabel:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
          description: Visibility-scoped payment method label, or null when not configured or not visible.
        paymentHandle:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 320
            - type: "null"
          description: Visibility-scoped payment handle, or null when not configured or not visible.
        paymentNote:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 1000
            - type: "null"
          description: Visibility-scoped payment note, or null when not configured or not visible.
        visibilityApplied:
          $ref: "#/components/schemas/PaymentDetailsVisibility"
        qrFile:
          oneOf:
            - $ref: "#/components/schemas/SettlementCounterpartyPaymentDetailsQrFileResponse"
            - type: "null"
          description: Safe metadata for the active linked payment QR file when visible through the settlement counterparty relationship, or null.
    SettlementCounterpartyPaymentDetailsQrFileResponse:
      type: object
      description: Safe counterparty payment QR file metadata for a settlement-scoped relationship. It never contains storage object keys, storage paths, provider URLs, vault references, bytes, thumbnails, direct URLs, or submitted filenames.
      required:
        - id
        - contentType
        - sizeBytes
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
          description: Stable file metadata identifier for the linked QR file.
        contentType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        updatedAtUtc:
          type: string
          format: date-time
    AttachSelfPaymentQrRequest:
      type: object
      description: Multipart form used to upload a single self payment QR image. The filename is treated as submitted transport metadata only and is not returned by the API.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Payment QR image. Allowed content types are image/png, image/jpeg, and image/webp; the maximum accepted file size is 2 MB.
    UpdateSelfPaymentDetailsRequest:
      type: object
      description: Safe self payment-details update. Missing text fields are preserved on update, explicit null clears them, whitespace-only text normalizes to null, and omitted visibility defaults only when creating a new payment profile.
      additionalProperties: false
      minProperties: 1
      properties:
        preferredMethodLabel:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Optional payment method label after server-side trimming.
        paymentHandle:
          oneOf:
            - type: string
              maxLength: 320
            - type: "null"
          description: Optional user-entered payment handle after server-side trimming.
        paymentNote:
          oneOf:
            - type: string
              maxLength: 1000
            - type: "null"
          description: Optional user-entered payment note after server-side trimming.
        visibility:
          $ref: "#/components/schemas/PaymentDetailsVisibility"
    SelfUserProfileResponse:
      type: object
      description: Safe self-profile response for the authenticated actor.
      required:
        - id
        - displayName
        - defaultCurrency
        - createdAtUtc
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    UpdateSelfUserProfileRequest:
      type: object
      description: Safe self-profile update. Profile identity is derived from the authenticated actor, not from client input.
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 160
          description: Display name after server-side trimming. Blank or whitespace-only values are rejected.
        defaultCurrency:
          oneOf:
            - $ref: "#/components/schemas/CurrencyCode"
            - type: "null"
          description: Optional default currency. Explicit null clears the value.
    SessionListResponse:
      type: object
      description: Safe active session metadata for the authenticated account. The list is capped by the API.
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SessionSummary"
    SessionSummary:
      type: object
      description: Bounded session metadata that excludes token material, hashes, network data, user-agent data, and revocation details.
      required:
        - id
        - isCurrent
        - status
        - issuedAtUtc
        - expiresAtUtc
        - lastSeenAtUtc
        - deviceLabel
      properties:
        id:
          type: string
          format: uuid
        isCurrent:
          type: boolean
        status:
          type: string
          enum:
            - active
        issuedAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
        lastSeenAtUtc:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        deviceLabel:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO-4217 style currency code.
      examples:
        - USD
    Money:
      type: object
      description: Decimal-safe money value with an attached currency.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Decimal-safe amount represented as a string to avoid floating point loss.
          examples:
            - "12.34"
        currency:
          $ref: "#/components/schemas/CurrencyCode"
    RoundingMode:
      type: string
      description: Placeholder rounding modes for future policy-driven money handling.
      enum:
        - up
        - down
        - nearest
        - bankers
    SyncOperationType:
      type: string
      description: Day 1 sync operation types accepted by the server sync foundation.
      enum:
        - bill_archive
        - bill_restore
    SyncResourceType:
      type: string
      description: Day 1 resource types supported by the server sync foundation.
      enum:
        - expense_bill
    SyncOperationStatus:
      type: string
      description: Safe sync operation result status.
      enum:
        - accepted
        - replayed
        - rejected
        - conflict
    SyncChangeKind:
      type: string
      description: Metadata-only change kind for cache invalidation.
      enum:
        - updated
        - archived
        - restored
    SyncOperationRequest:
      type: object
      description: Bounded server-mode sync operation envelope. Actor, profile, group, totals, settlement state, storage, file, OCR, auth, and audit authority are derived server-side.
      additionalProperties: false
      required:
        - idempotencyKey
        - operationType
        - resourceType
        - resourceId
        - baseVersion
        - payload
      properties:
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: Actor-scoped idempotency key for this queued operation.
        operationType:
          $ref: "#/components/schemas/SyncOperationType"
        resourceType:
          $ref: "#/components/schemas/SyncResourceType"
        resourceId:
          type: string
          format: uuid
          description: Server resource ID for the operation target.
        baseVersion:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
          description: Last known server resource version, or null when the client has no version.
        payload:
          type: object
          maxProperties: 16
          description: Bounded operation payload. Bill archive and restore currently accept an empty object only.
    SyncOperationResponse:
      type: object
      description: Safe sync operation result. It excludes raw payloads, merchant text, item notes, payment details, storage paths, OCR text, tokens, auth account IDs, and private notes.
      required:
        - operationId
        - status
        - resourceType
        - resourceId
        - resultingVersion
        - safeErrorCode
        - safeMessage
      properties:
        operationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SyncOperationStatus"
        resourceType:
          $ref: "#/components/schemas/SyncResourceType"
        resourceId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        resultingVersion:
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        safeErrorCode:
          oneOf:
            - type: string
              maxLength: 120
            - type: "null"
        safeMessage:
          oneOf:
            - type: string
              maxLength: 240
            - type: "null"
    SyncChangesResponse:
      type: object
      description: Bounded metadata-only sync change feed for resources visible to the current actor.
      required:
        - sinceVersion
        - nextSinceVersion
        - limit
        - resourceType
        - changes
      properties:
        sinceVersion:
          type: integer
          format: int64
          minimum: 0
        nextSinceVersion:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        resourceType:
          oneOf:
            - $ref: "#/components/schemas/SyncResourceType"
            - type: "null"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
    SyncChange:
      type: object
      description: Safe metadata for one visible resource version. Clients must call authorized resource endpoints to hydrate details.
      required:
        - resourceType
        - resourceId
        - version
        - changedAtUtc
        - changeKind
        - groupId
      properties:
        resourceType:
          $ref: "#/components/schemas/SyncResourceType"
        resourceId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        changedAtUtc:
          type: string
          format: date-time
        changeKind:
          $ref: "#/components/schemas/SyncChangeKind"
        groupId:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    SyncState:
      type: string
      description: Placeholder sync state values shared by local and server-mode clients.
      enum:
        - queued
        - synced
        - conflict
        - failed
    StorageObjectRef:
      type: object
      description: Stable storage object reference that does not expose physical filesystem paths.
      required:
        - id
      properties:
        id:
          type: string
          description: Opaque storage object identifier.
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
    ProblemDetails:
      type: object
      description: RFC 7807 / RFC 9457 style problem response.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    OcrJobStatus:
      type: string
      description: Placeholder OCR job status values for future worker contract design.
      enum:
        - queued
        - processing
        - completed
        - failed
