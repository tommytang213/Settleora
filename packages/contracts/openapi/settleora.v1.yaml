openapi: 3.1.0
info:
  title: Settleora API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: >
    OpenAPI contract for Settleora scaffold materialization. Generated mobile
    and web clients are produced from this file, and generated output
    must not be manually edited. This contract currently covers scaffold health
    checks, first-owner local bootstrap status/creation for fresh deployments,
    refresh-capable local sign-in, public refresh, current-session sign-out,
    current-account sign-out-all, current-account session list and per-session
    revocation, the minimal current-user auth read boundary, and guarded
    self-profile read/update endpoints, first personal and group bill create/read
    endpoints, bill submission and participant acknowledgement/rejection workflow endpoints,
    guarded group create/list/read/update and group member-management foundations
    plus guarded admin local-user list/read/create foundations; it is not the feature contract for
    general public registration, invitations, auth middleware, session management beyond
    current-session sign-out, current-account sign-out-all/list/revocation, and
    public refresh, broader user management, role assignment, group invitations,
    guest members, settlements, sync, OCR upload, UI behavior, or database behavior.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      description: Placeholder health endpoint for future API availability checks.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /health/ready:
    get:
      summary: Readiness check
      description: Checks PostgreSQL, RabbitMQ, and storage connectivity without exposing dependency details.
      operationId: getHealthReady
      security: []
      responses:
        "200":
          description: Service is ready for requests that require PostgreSQL, RabbitMQ, and storage connectivity.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                    example: ready
                  service:
                    type: string
                    example: settleora-api
                  checks:
                    type: object
                    required:
                      - postgres
                      - rabbitmq
                      - storage
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                        example: ok
                      rabbitmq:
                        type: string
                        enum:
                          - ok
                        example: ok
                      storage:
                        type: string
                        enum:
                          - ok
                        example: ok
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Service is not ready because PostgreSQL, RabbitMQ, or storage connectivity is unavailable.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - checks
                properties:
                  status:
                    type: string
                    enum:
                      - unready
                    example: unready
                  service:
                    type: string
                    example: settleora-api
                  checks:
                    type: object
                    required:
                      - postgres
                      - rabbitmq
                      - storage
                    properties:
                      postgres:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
                      rabbitmq:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
                      storage:
                        type: string
                        enum:
                          - ok
                          - failed
                        example: failed
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/bootstrap/status:
    get:
      summary: Bootstrap status
      description: Returns only whether first-owner local bootstrap is required because no auth account exists.
      operationId: getAuthBootstrapStatus
      security: []
      responses:
        "200":
          description: Bounded bootstrap setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatusResponse"
        "400":
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/bootstrap/local-owner:
    post:
      summary: Bootstrap first local owner
      description: Creates the first local owner account only while no auth account exists. This is not general public registration; clients must sign in normally after bootstrap succeeds.
      operationId: bootstrapLocalOwner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapLocalOwnerRequest"
      responses:
        "200":
          description: Local owner bootstrap succeeded without returning credential or token material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapLocalOwnerResponse"
        "400":
          description: The submitted bootstrap request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bootstrap is unavailable because an auth account already exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Bootstrap could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-in:
    post:
      summary: Local sign-in
      description: Authenticates a local account with an identifier and password, returning a refresh-capable opaque access session plus initial refresh-like credential only once on success.
      operationId: signInLocal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSignInRequest"
      responses:
        "200":
          description: Local sign-in succeeded and returned new credential material once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSignInResponse"
        "401":
          description: Sign-in failed without revealing account, credential, or policy state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Too many sign-in attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/refresh:
    post:
      summary: Refresh session
      description: Rotates a submitted refresh-like credential and returns a new opaque access-session token plus replacement refresh-like credential only on success.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Refresh succeeded and returned replacement credential material once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResponse"
        "401":
          description: Refresh failed without revealing credential, account, session, or family state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Refresh could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-out:
    post:
      summary: Current session sign-out
      description: Validates the submitted opaque bearer session token and revokes only that current session.
      operationId: signOutCurrentSession
      security:
        - SessionBearerAuth: []
      responses:
        "204":
          description: Current session was revoked. No response body is returned.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sign-out-all:
    post:
      summary: Current account sign-out-all
      description: Validates the submitted opaque bearer session token and revokes all active sessions owned by the authenticated account, including the submitted current session.
      operationId: signOutAllCurrentAccountSessions
      security:
        - SessionBearerAuth: []
      responses:
        "204":
          description: Active sessions for the current account were revoked. No response body is returned.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Sign-out-all failed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sessions:
    get:
      summary: Current account sessions
      description: Validates the submitted opaque bearer session token and lists safe metadata for active sessions owned by the authenticated account.
      operationId: listCurrentAccountSessions
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Active sessions owned by the authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      summary: Revoke current account session
      description: Validates the submitted opaque bearer session token and revokes one session owned by the authenticated account.
      operationId: revokeCurrentAccountSession
      security:
        - SessionBearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session ID to revoke.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session was revoked. No response body is returned.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Requested session is unavailable to revoke.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/auth/current-user:
    get:
      summary: Current authenticated user
      description: Validates an opaque bearer session token and returns the minimal authenticated actor, profile, session, and system-role summary.
      operationId: getCurrentUser
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Current authenticated user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users:
    get:
      summary: List admin users
      description: Lists safe user summaries for non-deleted profiles/accounts. Requires an authenticated SettleoraSession with system owner or admin role; ordinary users are forbidden. This is not public registration or invitation management.
      operationId: listAdminUsers
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Safe admin user summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users/local:
    post:
      summary: Create admin local user
      description: Creates a normal local-account user through an authenticated owner/admin path. The API derives the actor server-side, assigns only the system user role, and returns no session tokens, password material, credential metadata, provider payloads, audit metadata, storage paths, or invitation state. This is not public self-registration.
      operationId: createAdminLocalUser
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocalUserRequest"
      responses:
        "201":
          description: Local user was created with the default system user role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummaryResponse"
        "400":
          description: The submitted local-user creation request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: A local user cannot be created with the submitted information.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Local user creation could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/admin/users/{userProfileId}:
    get:
      summary: Get admin user
      description: Returns one safe user summary for a non-deleted profile/account. Requires an authenticated SettleoraSession with system owner or admin role; ordinary users are forbidden.
      operationId: getAdminUser
      security:
        - SessionBearerAuth: []
      parameters:
        - name: userProfileId
          in: path
          required: true
          description: User profile ID to read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe admin user summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummaryResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: The authenticated actor is not a system owner or admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: User profile or auth account is missing, deleted, or unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills:
    post:
      summary: Create personal bill
      description: Creates a draft personal bill for the authenticated actor. The API derives the creator, participant, and payer from the current session, keeps groupId null, calculates totals and resolved shares server-side, and rejects client-submitted ownership, participant, payer, group, file, or authorization IDs.
      operationId: createPersonalBill
      security:
        - SessionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalBillRequest"
      responses:
        "201":
          description: Personal draft bill created for the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBillResponse"
        "400":
          description: The submitted personal bill request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Personal bill creation could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      summary: List personal bills
      description: Lists non-archived personal bills created by the authenticated actor where groupId is null. This first foundation endpoint is intentionally unpaginated; future bill list slices are expected to add pagination or filtering when needed.
      operationId: listPersonalBills
      security:
        - SessionBearerAuth: []
      responses:
        "200":
          description: Personal bills visible to the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBillListResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: The current profile is unavailable or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills/{billId}:
    get:
      summary: Get personal bill
      description: Returns one non-archived personal bill only when it was created by the authenticated actor and has groupId null. Missing, archived, group, and unrelated bills return the same safe 404.
      operationId: getPersonalBill
      security:
        - SessionBearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
          description: Personal bill ID to read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Personal bill visible to the authenticated actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalBillResponse"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Bill is missing, archived, a group bill, unrelated, or unavailable to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills/{billId}/submit:
    post:
      summary: Submit personal bill
      description: Submits a draft or rejected personal bill created by the authenticated actor. Submission moves the bill to pending confirmation, resets participant acknowledgement state, and writes bounded safe audit metadata.
      operationId: submitPersonalBill
      security:
        - SessionBearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
          description: Personal bill ID to submit.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Personal bill submitted.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Bill is missing, archived, a group bill, unrelated, not created by the actor, or unavailable to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bill state does not allow submission.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Personal bill workflow write could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills/{billId}/participants/{userProfileId}/accept:
    post:
      summary: Accept personal bill participant share
      description: Accepts the authenticated actor's own participant row on a visible personal bill in pending confirmation. The route userProfileId must equal the current actor profile ID; final participant acceptance confirms the bill and writes bounded safe audit metadata.
      operationId: acceptPersonalBillParticipant
      security:
        - SessionBearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
          description: Personal bill ID.
          schema:
            type: string
            format: uuid
        - name: userProfileId
          in: path
          required: true
          description: Participant user profile ID. Must be the authenticated actor's own profile ID.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Participant acceptance recorded.
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Bill or participant is missing, archived, group-scoped, unrelated, route-mismatched, or unavailable to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bill or participant state does not allow acceptance.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Personal bill workflow write could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/bills/{billId}/participants/{userProfileId}/reject:
    post:
      summary: Reject personal bill participant share
      description: Rejects the authenticated actor's own participant row on a visible personal bill in pending confirmation using a bounded reason code. The route userProfileId must equal the current actor profile ID; rejection moves the bill to rejected and writes bounded safe audit metadata.
      operationId: rejectPersonalBillParticipant
      security:
        - SessionBearerAuth: []
      parameters:
        - name: billId
          in: path
          required: true
          description: Personal bill ID.
          schema:
            type: string
            format: uuid
        - name: userProfileId
          in: path
          required: true
          description: Participant user profile ID. Must be the authenticated actor's own profile ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectBillParticipantRequest"
      responses:
        "204":
          description: Participant rejection recorded.
        "400":
          description: The submitted rejection request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Authentication is required to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Bill or participant is missing, archived, group-scoped, unrelated, route-mismatched, or unavailable to the authenticated actor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Bill or participant state does not allow rejection.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Personal bill workflow write could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /api/v1/groups/{groupId}/bills:
    post:
      summary: Create group bill
      description: Creates a draft group bill for a non-deleted group where the authenticated actor is an active member. The route groupId is the only group identity input; the API derives creator/current actor server-side, validates split and payer profiles as active group members, calculates totals and resolved shares server-side, and rejects client-submitted ownership, creator, auth, session, file, or unrelated identity fields.
      operationId: createGroupBill
      security:
        - SessionBearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: Group ID that owns the bill.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBillRequest"
      responses:
