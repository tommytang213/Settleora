workflows:
  mobile-ios-validation:
    name: Mobile iOS validation
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter app
        script: |
          flutter analyze

      - name: Run Flutter tests
        script: |
          flutter test

    artifacts:
      - build/**/outputs/**/*.log
      - flutter_drive.log

  mobile-ios-testflight-internal:
    name: Mobile iOS internal TestFlight
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: settleora-app-store-connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tommytang213.settleora
      vars:
        FLUTTER_BUILD_NAME: "1.0.0"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter app
        script: |
          flutter analyze

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Set up iOS code signing settings
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: List signed iOS IPA artifacts
        script: |
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "PWD=$(pwd)"
          find "$CM_BUILD_DIR" -path "*/build/ios/ipa/*.ipa" -print
          find "$CM_BUILD_DIR" -path "*/build/ios/archive/*.xcarchive" -print

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/apps/mobile/flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
