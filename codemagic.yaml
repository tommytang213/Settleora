workflows:
  mobile-ios-validation:
    name: Mobile iOS validation
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Manual-only to protect hosted macOS minutes. Run this from Codemagic for
    # mobile/iOS, Codemagic config, signing, TestFlight, or release validation.

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter app
        script: |
          flutter analyze

      - name: Run non-visual Flutter tests
        script: |
          # Normal validation proves app validity without blocking on visual
          # evidence/screen-compare capture tests. Those run in
          # mobile-ios-visual-evidence for Codex/Figma/UI review.
          pwd
          TEST_FILES=$(find test -type f -name '*test.dart' ! -name '*visual_capture_test.dart' | sort)
          TEST_COUNT=$(printf '%s\n' "$TEST_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Selected non-visual Flutter test files: $TEST_COUNT"
          printf '%s\n' "$TEST_FILES"
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No non-visual Flutter tests were selected"
            exit 1
          fi
          flutter test -r expanded $TEST_FILES

    artifacts:
      - build/**/outputs/**/*.log
      - flutter_drive.log

  mobile-ios-visual-evidence:
    name: Mobile iOS visual evidence
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Manual-only Codex/Figma/UI comparison path. This workflow runs visual
    # evidence and screen-compare capture tests separately from app validity
    # and TestFlight preview build validation.

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Run visual evidence Flutter tests
        script: |
          # Visual evidence/screen-compare tests are intentionally explicit so
          # Codex/Figma/UI review can collect screenshots without blocking
          # internal TestFlight preview builds.
          pwd
          TEST_FILES=$(find test -type f -name '*visual_capture_test.dart' | sort)
          TEST_COUNT=$(printf '%s\n' "$TEST_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Selected visual Flutter test files: $TEST_COUNT"
          printf '%s\n' "$TEST_FILES"
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No visual Flutter tests were selected"
            exit 1
          fi
          flutter test -r expanded $TEST_FILES

    artifacts:
      - build/**/outputs/**/*.log
      - flutter_drive.log
      - /workspace/logs/settleora-visual-qa/**/*.png

  mobile-ios-testflight-internal:
    name: Mobile iOS internal TestFlight
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: settleora-app-store-connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tommytang213.settleora
      vars:
        FLUTTER_BUILD_NAME: "1.0.0"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze Flutter app
        script: |
          flutter analyze

      - name: Run non-visual Flutter tests
        script: |
          # TestFlight/internal preview builds validate app correctness and the
          # installable IPA path without being blocked by visual evidence or
          # screen-compare capture tests.
          pwd
          TEST_FILES=$(find test -type f -name '*test.dart' ! -name '*visual_capture_test.dart' | sort)
          TEST_COUNT=$(printf '%s\n' "$TEST_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Selected non-visual Flutter test files: $TEST_COUNT"
          printf '%s\n' "$TEST_FILES"
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No non-visual Flutter tests were selected"
            exit 1
          fi
          flutter test -r expanded $TEST_FILES

      - name: Set up iOS code signing settings
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed iOS IPA
        script: |
          flutter build ipa --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: List signed iOS IPA artifacts
        script: |
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "PWD=$(pwd)"
          find "$CM_BUILD_DIR" -path "*/build/ios/ipa/*.ipa" -print
          find "$CM_BUILD_DIR" -path "*/build/ios/archive/*.xcarchive" -print
          IPA_COUNT=$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -name "*.ipa" -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" = "0" ]; then
            echo "No IPA files were produced under $CM_BUILD_DIR/apps/mobile/build/ios/ipa"
            exit 1
          fi

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/apps/mobile/flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload the signed IPA to App Store Connect for internal TestFlight
        # visibility only. Do not set beta_groups to "Internal Testers":
        # Codemagic/App Store Connect beta group assignment is for supported
        # beta distribution groups and fails for Apple's internal tester group.
        submit_to_testflight: false
        submit_to_app_store: false
