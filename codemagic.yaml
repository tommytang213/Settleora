workflows:
  mobile-ios-validation:
    name: Mobile iOS validation
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Manual-only to protect hosted macOS minutes. Run this from Codemagic for
    # mobile/iOS, Codemagic config, signing, TestFlight, or release validation.

    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Validate Flutter release gate
        script: |
          ./tool/validate-release.sh

    artifacts:
      - build/**/outputs/**/*.log
      - flutter_drive.log

  mobile-ios-visual-evidence:
    name: Mobile iOS visual evidence
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Manual-only Codex/Figma/UI comparison path. This workflow runs visual
    # evidence and screen-compare capture tests separately from app validity
    # and TestFlight preview build validation.

    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Run visual evidence Flutter tests
        script: |
          # Visual evidence/screen-compare tests are intentionally explicit so
          # Codex/Figma/UI review can collect screenshots without blocking
          # internal TestFlight preview builds.
          pwd
          export SETTLEORA_VISUAL_OUTPUT_ROOT="$CM_BUILD_DIR/apps/mobile/build/settleora-visual-qa"
          VISUAL_CAPTURE_FILES=$(find test -type f \( -name '*visual*capture_test.dart' -o -name '*visual*evidence*_test.dart' \) | sort)
          VISUAL_CAPTURE_COUNT=$(printf '%s\n' "$VISUAL_CAPTURE_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          VISUAL_TAGGED_FILES=$(grep -R -l "tags:.*visual" test --include='*test.dart' 2>/dev/null | sort | while IFS= read -r TEST_FILE; do
            case "$TEST_FILE" in
              *visual*capture_test.dart|*visual*evidence*_test.dart) ;;
              *) printf '%s\n' "$TEST_FILE" ;;
            esac
          done || true)
          VISUAL_TAGGED_COUNT=$(printf '%s\n' "$VISUAL_TAGGED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')
          TEST_COUNT=$((VISUAL_CAPTURE_COUNT + VISUAL_TAGGED_COUNT))
          echo "Selected visual capture Flutter test files: $VISUAL_CAPTURE_COUNT"
          printf '%s\n' "$VISUAL_CAPTURE_FILES"
          echo "Selected visual-tagged Flutter test files: $VISUAL_TAGGED_COUNT"
          printf '%s\n' "$VISUAL_TAGGED_FILES"
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No visual Flutter tests were selected"
            exit 1
          fi
          if [ "$VISUAL_CAPTURE_COUNT" != "0" ]; then
            flutter test -r expanded $VISUAL_CAPTURE_FILES
          fi
          if [ "$VISUAL_TAGGED_COUNT" != "0" ]; then
            flutter test -r expanded --tags visual $VISUAL_TAGGED_FILES
          fi

    artifacts:
      - build/**/outputs/**/*.log
      - flutter_drive.log
      - $CM_BUILD_DIR/apps/mobile/build/settleora-visual-qa/**/*.png

  mobile-ios-testflight-internal:
    name: Mobile iOS signed release candidate validation
    working_directory: apps/mobile
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: settleora-app-store-connect

    environment:
      flutter: 3.44.8
      xcode: "16.4"
      cocoapods: 1.17.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tommytang213.settleora
      vars:
        FLUTTER_BUILD_NAME: "1.0.0"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Show Flutter version
        script: |
          pwd
          flutter --version

      - name: Validate Flutter release gate
        script: |
          ./tool/validate-release.sh

      - name: Set up iOS code signing settings
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build signed iOS IPA
        script: |
          test "$(git rev-parse HEAD)" = "$CM_COMMIT"
          source_tree=$(git rev-parse 'HEAD^{tree}')
          ./tool/build-production-ios.sh \
            --mode=signed \
            --source-sha="$CM_COMMIT" \
            --source-tree="$source_tree" \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --provenance-out="$CM_BUILD_DIR/apps/mobile/build/ios/release-provenance.json"

      - name: Verify retained signed iOS artifacts
        script: |
          IPA_COUNT=$(find "$CM_BUILD_DIR/apps/mobile/build/ios/ipa" -name "*.ipa" -type f 2>/dev/null | wc -l | tr -d ' ')
          test "$IPA_COUNT" = "1"
          ARCHIVE_COUNT=$(find "$CM_BUILD_DIR/apps/mobile/build/ios/archive" -maxdepth 1 -name "*.xcarchive" -type d 2>/dev/null | wc -l | tr -d ' ')
          test "$ARCHIVE_COUNT" = "1"
          test -s "$CM_BUILD_DIR/apps/mobile/build/ios/release-provenance.json"

    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/apps/mobile/build/ios/archive/*.xcarchive
      - $CM_BUILD_DIR/apps/mobile/build/ios/release-provenance.json
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/apps/mobile/flutter_drive.log
