name: Security Semgrep CE Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 4"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE scan
    runs-on: ubuntu-24.04

    env:
      SEMGREP_SEND_METRICS: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep CE scan
        shell: bash
        run: |
          set +e
          docker run --rm \
            -e SEMGREP_SEND_METRICS=off \
            -v "${PWD}:/src" \
            -w /src \
            semgrep/semgrep:1.167.0 \
            semgrep scan --config p/default --sarif --output semgrep-results.sarif --metrics=off .
          status="$?"
          if [ ! -s semgrep-results.sarif ]; then
            echo "Semgrep did not produce semgrep-results.sarif."
            exit "${status}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "Semgrep exited with ${status}; continuing because baseline findings are non-blocking."
          fi

      - name: Upload Semgrep SARIF
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-ce
