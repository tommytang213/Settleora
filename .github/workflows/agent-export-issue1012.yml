name: Apply Issue 1012 source repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-export-issue1012.yml
      - .github/agent-issue1012-repair.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply exact repair patch
        shell: bash
        run: |
          set -euo pipefail
          payload='.github/agent-issue1012-repair.patch.gz.b64'
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = '0c6ac8e7d4cab3764912315f4c6ccae3c0ccd5a60bc62e59081edcf3253bc3f3'
          base64 --decode "$payload" | gzip --decompress > "$RUNNER_TEMP/issue1012-repair.patch"
          test "$(sha256sum "$RUNNER_TEMP/issue1012-repair.patch" | cut -d' ' -f1)" = 'ff874f8d5eaf477c0b3fa79f8c18d41ff91d24d1e8c2a3af78dc9bcf381523be'
          git apply --check "$RUNNER_TEMP/issue1012-repair.patch"
          git apply --index "$RUNNER_TEMP/issue1012-repair.patch"
          git config user.name 'tommytang213'
          git config user.email '61879201+tommytang213@users.noreply.github.com'
          git commit -m 'fix(auto-runner): repair manual-root handoff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
