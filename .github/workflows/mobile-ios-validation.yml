name: Mobile iOS Validation

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Exact candidate SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Exact commit SHA expected after checkout."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Optional exact commit SHA expected after checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  ios-validation:
    name: Build iOS simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 1

      - name: Verify expected head
        if: ${{ inputs.expected_head != '' }}
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          echo "Expected head: ${EXPECTED_HEAD}"
          echo "Actual head:   ${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"

      - name: Setup Flutter
        # Pinned from subosito/flutter-action@v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          # Keep Linux and macOS on the same repository-validated stable SDK.
          flutter-version: "3.44.8"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prove portable Flutter test font discovery
        working-directory: apps/mobile
        run: flutter test test/helpers/settleora_visual_test_environment_test.dart --plain-name "loads the real Roboto and Material Icons font files"

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS simulator
        working-directory: apps/mobile
        run: flutter build ios --debug --simulator
