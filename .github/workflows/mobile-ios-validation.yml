name: Mobile iOS Validation

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Exact candidate SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Exact commit SHA expected after checkout."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Optional exact commit SHA expected after checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  ios-validation:
    name: Build iOS simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 1

      - name: Verify expected head
        if: ${{ inputs.expected_head != '' }}
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          echo "Expected head: ${EXPECTED_HEAD}"
          echo "Actual head:   ${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"

      - name: Setup Flutter
        # Pinned from subosito/flutter-action@v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          # Keep Linux and macOS on the same repository-validated stable SDK.
          flutter-version: "3.44.8"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Prove portable Flutter test font discovery
        working-directory: apps/mobile
        run: flutter test test/helpers/settleora_visual_test_environment_test.dart --plain-name "loads the real Roboto and Material Icons font files"

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS simulator
        working-directory: apps/mobile
        run: flutter build ios --debug --simulator

      # This unit suite is additional evidence; native OCR acceptance and signed
      # package qualification remain separate required gates.
      - name: Run RunnerTests Swift unit suite
        working-directory: apps/mobile/ios
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-unit-devices.json"
          udid="$(python3 - "$RUNNER_TEMP/ios-unit-devices.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"]
          runtimes = [
              runtime for runtime in devices
              if re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-\d+(?:-\d+)*", runtime)
          ]
          runtimes.sort(key=lambda runtime: tuple(
              int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")
          ), reverse=True)
          for runtime in runtimes:
              phones = sorted(
                  (device for device in devices[runtime]
                   if device.get("isAvailable") is True
                   and device.get("name", "").startswith("iPhone")),
                  key=lambda device: (device["name"], device["udid"]),
              )
              if phones:
                  print(phones[0]["udid"])
                  break
          else:
              sys.exit("No available iPhone simulator for RunnerTests")
          PY
          )"
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -only-testing:RunnerTests \
            -resultBundlePath "$RUNNER_TEMP/settleora-runner-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Retain RunnerTests results
        if: ${{ always() }}
        # Pinned from actions/upload-artifact@v4.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-runner-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settleora-runner-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
