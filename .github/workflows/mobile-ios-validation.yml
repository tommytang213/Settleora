name: Mobile iOS Validation

on:
  pull_request:
    # Automatic iOS builds are limited to native/dependency/workflow changes
    # to conserve hosted macOS minutes. Use workflow_dispatch for large mobile
    # PRs or release validation.
    paths:
      - "apps/mobile/ios/**"
      - "apps/mobile/pubspec.yaml"
      - "apps/mobile/pubspec.lock"
      - ".github/workflows/mobile-ios-validation.yml"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Optional exact commit SHA expected after checkout."
        required: false
        type: string

permissions:
  contents: read

jobs:
  ios-validation:
    name: Build iOS simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.checkout_ref || github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify expected head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head != '' }}
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          echo "Expected head: ${EXPECTED_HEAD}"
          echo "Actual head:   ${actual_head}"
          test "${actual_head}" = "${EXPECTED_HEAD}"

      - name: Setup Flutter
        # Pinned from subosito/flutter-action@v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build iOS simulator
        working-directory: apps/mobile
        run: flutter build ios --debug --simulator
