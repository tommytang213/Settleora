name: Security CodeQL

on:
  pull_request:
    branches: [main, ai/integration, uat, prod, 'release/*', 'hotfix/*']
  push:
    branches: [main, ai/integration, uat, prod, 'release/*', 'hotfix/*']
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: CodeQL applicability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    outputs:
      matrix: ${{ steps.proof.outputs.matrix }}
      mode: ${{ steps.proof.outputs.mode }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load trusted CodeQL controller
        id: controller
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$BASE_REVISION"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$revision:tools/ci/codeql-gate.mjs"; then
            # Reviewed bootstrap authority, retained in task history. A base
            # without the workflow/helper cannot qualify for docs applicability.
            revision=c778cf3ed81a1c6146f6013d026610c575eb9243
          fi
          controller="$RUNNER_TEMP/codeql-controller"
          mkdir -p "$controller"
          for file in codeql-gate.mjs scaffold-validation-changes.mjs; do
            git show "$revision:tools/ci/$file" > "$controller/$file"
          done
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Trusted controller revision: $revision"
      - id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/codeql-controller/codeql-gate.mjs" prepare < "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL work (${{ matrix.language }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Docs applicability only
        if: matrix.language == 'docs-only'
        run: echo 'No CodeQL language extraction, query execution or SARIF upload applies to this proven docs-only PR.'
      - name: Initialize CodeQL
        if: matrix.language != 'docs-only'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            threat-models: [local]
      - name: Analyze and process CodeQL
        if: matrix.language != 'docs-only'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  gate:
    name: CodeQL
    if: always()
    needs: [prepare, analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load trusted CodeQL controller
        id: controller
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$BASE_REVISION"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$revision:tools/ci/codeql-gate.mjs"; then
            # Reviewed bootstrap authority, retained in task history. A base
            # without the workflow/helper cannot qualify for docs applicability.
            revision=c778cf3ed81a1c6146f6013d026610c575eb9243
          fi
          controller="$RUNNER_TEMP/codeql-controller"
          mkdir -p "$controller"
          for file in codeql-gate.mjs scaffold-validation-changes.mjs; do
            git show "$revision:tools/ci/$file" > "$controller/$file"
          done
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Trusted controller revision: $revision"
      - name: Verify exact-current applicability and scanner gate
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_MODE: ${{ needs.prepare.outputs.mode }}
          NEEDS_RESULTS: '{"prepare":"${{ needs.prepare.result }}","analyze":"${{ needs.analyze.result }}"}'
        run: node "$RUNNER_TEMP/codeql-controller/codeql-gate.mjs" gate < "$GITHUB_EVENT_PATH" >> "$GITHUB_STEP_SUMMARY"
