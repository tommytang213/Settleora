name: Scaffold Validation

on:
  pull_request:
    branches:
      - main
      - ai/integration
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  classify:
    name: Classify and validate scaffold
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      run_full_validation: ${{ steps.changes.outputs.run_full_validation }}
      run_mobile_validation: ${{ steps.changes.outputs.run_mobile_validation }}
      run_ios_validation: ${{ steps.changes.outputs.run_ios_validation }}
      run_web_user_validation: ${{ steps.changes.outputs.run_web_user_validation }}

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_REF: ${{ github.ref }}
        run: node tools/ci/scaffold-validation-changes.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Validate scaffold paths
        run: npm run validate:scaffold

      - name: Test CI routing and workflow policy
        run: node --test tools/ci/test/*.test.mjs

  full-validation:
    name: Validate API and generated artifacts
    needs: classify
    if: ${{ needs.classify.outputs.run_full_validation == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Setup .NET
        # Pinned from actions/setup-dotnet@v5.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "9.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI
        run: npm run validate:openapi

      - name: Validate generated clients
        run: npm run validate:clients

      - name: Validate API
        run: npm run validate:api

      - name: Validate Docker Compose
        run: npm run validate:compose

      - name: Validate API Docker image
        run: npm run validate:api-docker

  mobile-validation:
    name: Validate mobile
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_mobile_validation == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Setup .NET
        # Pinned from actions/setup-dotnet@v5.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "9.0.x"

      - name: Setup Flutter
        # Pinned from subosito/flutter-action@v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          # Keep Linux and macOS on the same repository-validated stable SDK.
          flutter-version: "3.44.8"
          cache: true

      - name: Validate mobile
        run: npm run validate:mobile

  ios-validation:
    name: Validate iOS simulator
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_ios_validation == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mobile-ios-validation.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      expected_head: ${{ github.event.pull_request.head.sha }}

  web-user-validation:
    name: Validate and package user web
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_web_user_validation == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact pull request source head
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact pull request source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-user/package-lock.json

      - name: Clean install user-web dependencies
        working-directory: apps/web-user
        run: npm ci

      - name: Lint and typecheck user web
        working-directory: apps/web-user
        run: npm run lint

      - name: Test user web
        working-directory: apps/web-user
        run: npm test

      - name: Build production user web
        working-directory: apps/web-user
        run: npm run build

      - name: Generate and scan deterministic package evidence
        id: package
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          package_evidence_dir="$RUNNER_TEMP/user-web-package-evidence"
          test ! -e "$package_evidence_dir"
          node tools/ci/user-web-dist-manifest.mjs \
            --expected-source-sha "$EXPECTED_HEAD" \
            --staging "$package_evidence_dir"
          echo "package_evidence_dir=$package_evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Upload exact user-web package evidence
        id: upload
        # Pinned from actions/upload-artifact@v4.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: user-web-dist-${{ github.event.pull_request.head.sha }}
          path: ${{ steps.package.outputs.package_evidence_dir }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Record discoverable artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_URL"
          test -n "$ARTIFACT_DIGEST"
          {
            echo "User-web artifact ID: $ARTIFACT_ID"
            echo "User-web artifact URL: $ARTIFACT_URL"
            echo "Upload archive digest: $ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    name: Validate scaffold
    if: ${{ always() }}
    needs:
      - classify
      - full-validation
      - mobile-validation
      - ios-validation
      - web-user-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Enforce classifier-required validation results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_FULL_VALIDATION: ${{ needs.classify.outputs.run_full_validation }}
          RUN_MOBILE_VALIDATION: ${{ needs.classify.outputs.run_mobile_validation }}
          RUN_IOS_VALIDATION: ${{ needs.classify.outputs.run_ios_validation }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          MOBILE_RESULT: ${{ needs.mobile-validation.result }}
          IOS_RESULT: ${{ needs.ios-validation.result }}
          RUN_WEB_USER_VALIDATION: ${{ needs.classify.outputs.run_web_user_validation }}
          WEB_USER_RESULT: ${{ needs.web-user-validation.result }}
        run: node tools/ci/scaffold-validation-changes.mjs --validate-gate
