name: Scaffold Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_REF: ${{ github.ref }}
        run: node tools/ci/scaffold-validation-changes.mjs >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.changes.outputs.run_full_validation == 'true'
        # Pinned from actions/setup-dotnet@v5.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "9.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Validate scaffold paths
        run: npm run validate:scaffold

      - name: Test scaffold classifier
        run: node --test tools/ci/test/scaffold-validation-changes.test.mjs

      - name: Test protected CodeQL auditor
        run: node --test tools/ci/test/codeql-protected-auditor.test.mjs

      - name: Validate OpenAPI
        if: steps.changes.outputs.run_full_validation == 'true'
        run: npm run validate:openapi

      - name: Validate generated clients
        if: steps.changes.outputs.run_full_validation == 'true'
        run: npm run validate:clients

      - name: Validate API
        if: steps.changes.outputs.run_full_validation == 'true'
        run: npm run validate:api

      - name: Validate Docker Compose
        if: steps.changes.outputs.run_full_validation == 'true'
        run: npm run validate:compose

      - name: Validate API Docker image
        if: steps.changes.outputs.run_full_validation == 'true'
        run: npm run validate:api-docker
