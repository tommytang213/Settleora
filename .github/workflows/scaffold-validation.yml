name: Scaffold Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  classify:
    name: Classify and validate scaffold
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      run_full_validation: ${{ steps.changes.outputs.run_full_validation }}
      run_mobile_validation: ${{ steps.changes.outputs.run_mobile_validation }}
      run_ios_validation: ${{ steps.changes.outputs.run_ios_validation }}

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_REF: ${{ github.ref }}
        run: node tools/ci/scaffold-validation-changes.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Validate scaffold paths
        run: npm run validate:scaffold

      - name: Test CI routing and workflow policy
        run: node --test tools/ci/test/*.test.mjs

  full-validation:
    name: Validate API and generated artifacts
    needs: classify
    if: ${{ needs.classify.outputs.run_full_validation == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Setup .NET
        # Pinned from actions/setup-dotnet@v5.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "9.0.x"

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI
        run: npm run validate:openapi

      - name: Validate generated clients
        run: npm run validate:clients

      - name: Validate API
        run: npm run validate:api

      - name: Validate Docker Compose
        run: npm run validate:compose

      - name: Validate API Docker image
        run: npm run validate:api-docker

  mobile-validation:
    name: Validate mobile
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_mobile_validation == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Setup .NET
        # Pinned from actions/setup-dotnet@v5.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "9.0.x"

      - name: Setup Flutter
        # Pinned from subosito/flutter-action@v2.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          # Keep Linux and macOS on the same repository-validated stable SDK.
          flutter-version: "3.44.8"
          cache: true

      - name: Prepare repository mobile test paths
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          if [[ ! -e /opt/flutter ]]; then
            sudo ln -s "$flutter_root" /opt/flutter
          fi
          test "$(readlink -f /opt/flutter)" = "$(readlink -f "$flutter_root")"
          sudo install -d -o "$(id -u)" -g "$(id -g)" /workspace/logs

      - name: Validate mobile
        run: npm run validate:mobile

  ios-validation:
    name: Validate iOS simulator
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.run_ios_validation == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mobile-ios-validation.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      expected_head: ${{ github.event.pull_request.head.sha }}

  aggregate:
    name: Validate scaffold
    if: ${{ always() }}
    needs:
      - classify
      - full-validation
      - mobile-validation
      - ios-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned from actions/checkout@v6.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Enforce classifier-required validation results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_FULL_VALIDATION: ${{ needs.classify.outputs.run_full_validation }}
          RUN_MOBILE_VALIDATION: ${{ needs.classify.outputs.run_mobile_validation }}
          RUN_IOS_VALIDATION: ${{ needs.classify.outputs.run_ios_validation }}
          FULL_RESULT: ${{ needs.full-validation.result }}
          MOBILE_RESULT: ${{ needs.mobile-validation.result }}
          IOS_RESULT: ${{ needs.ios-validation.result }}
        run: node tools/ci/scaffold-validation-changes.mjs --validate-gate
