name: Mobile OCR Native Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-ocr-native-acceptance.yml"
      - "apps/mobile/integration_test/receipt_ocr_real_provider_test.dart"
      - "apps/mobile/android/**"
      - "apps/mobile/assets/receipt_ocr_models/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/lib/receipt_ocr_capture/**"
      - "apps/mobile/test/fixtures/receipt_ocr/**"
      - "tools/ocr-models/native-acceptance-evidence.mjs"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Exact commit SHA expected after checkout."
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.checkout_ref }}
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_head }}

jobs:
  android-native-acceptance:
    name: Android 101-image real-provider acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Verify immutable OCR models and fixture corpus
        run: npm run validate:ocr-models

      - name: Start trusted Android emulator
        id: environment
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name settleora-ocr --package "system-images;android-35;google_apis;x86_64"
          nohup emulator -avd settleora-ocr -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect >"$RUNNER_TEMP/android-emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          sanitize() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.:\[\]-' '_'; }
          echo "runner_image=$(sanitize "${ImageOS:-unknown}-${ImageVersion:-unknown}")" >> "$GITHUB_OUTPUT"
          echo "os_runtime=$(sanitize "android-api$(adb shell getprop ro.build.version.sdk | tr -d '\r')-$(adb shell getprop ro.build.id | tr -d '\r')")" >> "$GITHUB_OUTPUT"
          echo "sdk_toolchain=$(sanitize "emulator-$(emulator -version | head -1 | awk '{print $3}')")" >> "$GITHUB_OUTPUT"
          echo "device=Android_Emulator_API_35_google_apis_x86_64" >> "$GITHUB_OUTPUT"

      - name: Execute Android real-provider acceptance
        id: acceptance
        timeout-minutes: 180
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          flutter test integration_test/receipt_ocr_real_provider_test.dart -d emulator-5554 --timeout 6h 2>&1 | tee "$RUNNER_TEMP/android-acceptance.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Measure Android package and model payload delta
        if: always()
        id: package
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter build apk --debug
          full_bytes=$(stat -c %s build/app/outputs/flutter-apk/app-debug.apk)
          find assets/receipt_ocr_models -mindepth 2 -type f -exec truncate -s 0 {} +
          flutter build apk --debug
          baseline_bytes=$(stat -c %s build/app/outputs/flutter-apk/app-debug.apk)
          echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
          echo "baseline_bytes=$baseline_bytes" >> "$GITHUB_OUTPUT"

      - name: Build bounded Android evidence
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          test -f "$RUNNER_TEMP/android-acceptance.log" || : >"$RUNNER_TEMP/android-acceptance.log"
          node tools/ocr-models/native-acceptance-evidence.mjs \
            --log="$RUNNER_TEMP/android-acceptance.log" \
            --out="$RUNNER_TEMP/android-ocr-acceptance.json" \
            --platform=android \
            --source-sha="$EXPECTED_HEAD" \
            --test-status="${{ steps.acceptance.outputs.status }}" \
            --runner-image="${{ steps.environment.outputs.runner_image }}" \
            --os-runtime="${{ steps.environment.outputs.os_runtime }}" \
            --sdk-toolchain="${{ steps.environment.outputs.sdk_toolchain }}" \
            --device="${{ steps.environment.outputs.device }}" \
            --full-bytes="${{ steps.package.outputs.full_bytes }}" \
            --baseline-bytes="${{ steps.package.outputs.baseline_bytes }}" \
            --require-complete=true

      - name: Upload bounded Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-ocr-native-acceptance-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/android-ocr-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Android acceptance result
        if: always()
        run: test "${{ steps.acceptance.outputs.status }}" = "0"

  ios-native-acceptance:
    name: iOS 101-image real-provider acceptance
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_REF }}

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies and pods
        working-directory: apps/mobile
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Verify immutable OCR models and fixture corpus
        run: npm run validate:ocr-models

      - name: Boot trusted iOS simulator
        id: simulator
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for x in d["com.apple.CoreSimulator.SimRuntime.iOS-18-5"] if x["name"] == "iPhone 16"))')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          sanitize() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.:\[\]-' '_'; }
          echo "runner_image=$(sanitize "${ImageOS:-unknown}-${ImageVersion:-unknown}")" >> "$GITHUB_OUTPUT"
          echo "os_runtime=$(sanitize "$runtime")" >> "$GITHUB_OUTPUT"
          echo "sdk_toolchain=$(sanitize "$(xcodebuild -version | tr '\n' '-')")" >> "$GITHUB_OUTPUT"
          echo "device=iPhone_16" >> "$GITHUB_OUTPUT"

      - name: Execute iOS real-provider acceptance
        id: acceptance
        timeout-minutes: 180
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          flutter test integration_test/receipt_ocr_real_provider_test.dart -d "${{ steps.simulator.outputs.udid }}" --timeout 6h 2>&1 | tee "$RUNNER_TEMP/ios-acceptance.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Measure iOS app and model payload delta
        if: always()
        id: package
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter build ios --debug --simulator
          full_bytes=$(find build/ios/iphonesimulator/Runner.app -type f -exec stat -f %z {} + | awk '{sum += $1} END {print sum}')
          find assets/receipt_ocr_models -mindepth 2 -type f -exec truncate -s 0 {} +
          flutter build ios --debug --simulator
          baseline_bytes=$(find build/ios/iphonesimulator/Runner.app -type f -exec stat -f %z {} + | awk '{sum += $1} END {print sum}')
          echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
          echo "baseline_bytes=$baseline_bytes" >> "$GITHUB_OUTPUT"

      - name: Build bounded iOS evidence
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          test -f "$RUNNER_TEMP/ios-acceptance.log" || : >"$RUNNER_TEMP/ios-acceptance.log"
          node tools/ocr-models/native-acceptance-evidence.mjs \
            --log="$RUNNER_TEMP/ios-acceptance.log" \
            --out="$RUNNER_TEMP/ios-ocr-acceptance.json" \
            --platform=ios \
            --source-sha="$EXPECTED_HEAD" \
            --test-status="${{ steps.acceptance.outputs.status }}" \
            --runner-image="${{ steps.simulator.outputs.runner_image }}" \
            --os-runtime="${{ steps.simulator.outputs.os_runtime }}" \
            --sdk-toolchain="${{ steps.simulator.outputs.sdk_toolchain }}" \
            --device="${{ steps.simulator.outputs.device }}" \
            --full-bytes="${{ steps.package.outputs.full_bytes }}" \
            --baseline-bytes="${{ steps.package.outputs.baseline_bytes }}" \
            --require-complete=true

      - name: Upload bounded iOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ocr-native-acceptance-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/ios-ocr-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce iOS acceptance result
        if: always()
        run: test "${{ steps.acceptance.outputs.status }}" = "0"
