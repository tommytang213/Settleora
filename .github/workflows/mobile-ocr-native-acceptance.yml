name: Mobile OCR Native Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-ocr-native-acceptance.yml"
      - "apps/mobile/integration_test/receipt_ocr_real_provider_test.dart"
      - "apps/mobile/android/**"
      - "apps/mobile/assets/receipt_ocr_models/**"
      - "apps/mobile/ios/**"
      - "apps/mobile/lib/receipt_ocr_capture/**"
      - "apps/mobile/test/fixtures/receipt_ocr/**"
      - "tools/ocr-models/**"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag, or SHA to validate."
        required: true
        type: string
      expected_head:
        description: "Exact commit SHA expected after checkout."
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.checkout_ref }}
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_head }}

jobs:
  android-native-acceptance:
    name: Android 101-image real-provider acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Verify immutable OCR models and fixture corpus
        run: npm run validate:ocr-models

      - name: Execute Android real-provider acceptance on trusted emulator
        id: acceptance
        timeout-minutes: 180
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect
          working-directory: apps/mobile
          script: bash "$GITHUB_WORKSPACE/tools/ocr-models/run-android-native-acceptance.sh"

      - name: Measure Android package and model payload delta
        if: ${{ !cancelled() }}
        id: package
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          candidate_dir="$RUNNER_TEMP/android-candidate-package"
          mkdir -p "$candidate_dir"
          git archive "$EXPECTED_HEAD" | tar -x -C "$candidate_dir"
          (
            cd "$candidate_dir/apps/mobile"
            flutter pub get
            flutter build apk --release
          )
          full_apk="$candidate_dir/apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          full_bytes=$(stat -c %s "$full_apk")
          node tools/ocr-models/verify-mobile-package.mjs --platform=android --package="$full_apk" --repo-root="$candidate_dir"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"
          "$apkanalyzer" dex packages "$full_apk" >"$RUNNER_TEMP/android-dex-packages.txt"
          ! grep -F 'dev.flutter.plugins.integration_test' "$RUNNER_TEMP/android-dex-packages.txt"
          find "$candidate_dir/apps/mobile/assets/receipt_ocr_models" -mindepth 2 -type f -exec truncate -s 0 {} +
          (
            cd "$candidate_dir/apps/mobile"
            flutter clean
            flutter pub get
            flutter build apk --release
          )
          model_free_bytes=$(stat -c %s "$full_apk")
          base_sha=e4d4edd0d6854845cc67b00924f6d22af6a70688
          git cat-file -e "$base_sha^{commit}"
          base_dir="$RUNNER_TEMP/android-base-app"
          mkdir -p "$base_dir"
          git archive "$base_sha" | tar -x -C "$base_dir"
          (
            cd "$base_dir/apps/mobile"
            flutter pub get
            flutter build apk --release
          )
          base_app_bytes=$(stat -c %s "$base_dir/apps/mobile/build/app/outputs/flutter-apk/app-release.apk")
          echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
          echo "model_free_bytes=$model_free_bytes" >> "$GITHUB_OUTPUT"
          echo "base_app_bytes=$base_app_bytes" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Build bounded Android evidence
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          test -f "$RUNNER_TEMP/android-acceptance.log" || : >"$RUNNER_TEMP/android-acceptance.log"
          test -f "$RUNNER_TEMP/android-acceptance.stderr.log" || : >"$RUNNER_TEMP/android-acceptance.stderr.log"
          node tools/ocr-models/native-acceptance-evidence.mjs \
            --log="$RUNNER_TEMP/android-acceptance.log" \
            --stderr-log="$RUNNER_TEMP/android-acceptance.stderr.log" \
            --out="$RUNNER_TEMP/android-ocr-acceptance.json" \
            --platform=android \
            --source-sha="$EXPECTED_HEAD" \
            --test-status="${{ steps.acceptance.outputs.status }}" \
            --failure-phase="${{ steps.acceptance.outputs.failure_phase }}" \
            --runner-image="${{ steps.acceptance.outputs.runner_image }}" \
            --os-runtime="${{ steps.acceptance.outputs.os_runtime }}" \
            --sdk-toolchain="${{ steps.acceptance.outputs.sdk_toolchain }}" \
            --device="${{ steps.acceptance.outputs.device }}" \
            --native-image="${{ steps.acceptance.outputs.native_image }}" \
            --full-bytes="${{ steps.package.outputs.full_bytes }}" \
            --model-free-bytes="${{ steps.package.outputs.model_free_bytes }}" \
            --base-app-bytes="${{ steps.package.outputs.base_app_bytes }}" \
            --base-sha="${{ steps.package.outputs.base_sha }}" \
            --require-complete=true

      - name: Upload bounded Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-ocr-native-acceptance-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/android-ocr-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Android acceptance result
        if: always()
        run: test "${{ steps.acceptance.outputs.status }}" = "0"

  ios-native-acceptance:
    name: iOS 101-image real-provider acceptance
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Verify immutable OCR models and fixture corpus
        run: npm run validate:ocr-models

      - name: Select trusted Xcode and CocoaPods
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          test "$(pod --version)" = "1.17.0"

      - name: Install dependencies and pods
        working-directory: apps/mobile
        run: |
          flutter pub get
          cd ios
          pod install --deployment
          test -s Podfile.lock
          test "$(shasum -a 256 Podfile.lock | awk '{print $1}')" = "08afc1413159dcd818b669869736fc56e38a99618a1f951e605b1eea02dc5189"

      - name: Boot trusted iOS simulator
        id: simulator
        shell: bash
        run: |
          test "$(xcode-select -p)" = "/Applications/Xcode_16.4.app/Contents/Developer"
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for x in d["com.apple.CoreSimulator.SimRuntime.iOS-18-5"] if x["name"] == "iPhone 16"))')
          xcrun simctl shutdown "$udid" || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          : "${ImageOS:?Hosted runner image OS is unavailable}"
          : "${ImageVersion:?Hosted runner image version is unavailable}"
          sanitize() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.:\[\]-' '_'; }
          runtime_build=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; values=json.load(sys.stdin)["runtimes"]; value=next(x for x in values if x["identifier"] == "com.apple.CoreSimulator.SimRuntime.iOS-18-5"); print(value.get("buildversion") or value["version"])')
          test -n "$runtime_build"
          echo "runner_image=$(sanitize "${ImageOS}-${ImageVersion}")" >> "$GITHUB_OUTPUT"
          echo "os_runtime=$(sanitize "$runtime")" >> "$GITHUB_OUTPUT"
          echo "sdk_toolchain=$(sanitize "$(xcodebuild -version | tr '\n' '-')-cocoapods-$(pod --version)")" >> "$GITHUB_OUTPUT"
          echo "device=iPhone_16" >> "$GITHUB_OUTPUT"
          echo "native_image=$(sanitize "ios-18.5-${runtime_build}-iPhone_16")" >> "$GITHUB_OUTPUT"

      - name: Execute iOS real-provider acceptance
        id: acceptance
        timeout-minutes: 180
        working-directory: apps/mobile
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/ocr-models/run-ios-native-acceptance.sh" "${{ steps.simulator.outputs.udid }}"

      - name: Measure iOS app and model payload delta
        if: ${{ !cancelled() }}
        id: package
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          candidate_dir="$RUNNER_TEMP/ios-candidate-package"
          mkdir -p "$candidate_dir"
          git archive "$EXPECTED_HEAD" | tar -x -C "$candidate_dir"
          (
            cd "$candidate_dir/apps/mobile"
            flutter pub get
            cd ios
            pod install --deployment
            test "$(shasum -a 256 Podfile.lock | awk '{print $1}')" = "08afc1413159dcd818b669869736fc56e38a99618a1f951e605b1eea02dc5189"
            cd ..
            flutter build ios --release --no-codesign
          )
          full_app="$candidate_dir/apps/mobile/build/ios/iphoneos/Runner.app"
          full_bytes=$(find "$full_app" -type f -exec stat -f %z {} + | awk '{sum += $1} END {print sum}')
          node tools/ocr-models/verify-mobile-package.mjs --platform=ios --package="$full_app" --repo-root="$candidate_dir"
          : >"$RUNNER_TEMP/ios-production-symbols.txt"
          binary_count=0
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              binary_count=$((binary_count + 1))
              nm -a "$candidate" >>"$RUNNER_TEMP/ios-production-symbols.txt"
              strings "$candidate" >>"$RUNNER_TEMP/ios-production-symbols.txt"
            fi
          done < <(find "$full_app" -type f -perm -111 -print)
          test "$binary_count" -gt 0
          ! grep -Ei 'IntegrationTestPlugin|dev\.flutter\.plugins\.integration_test' "$RUNNER_TEMP/ios-production-symbols.txt"
          find "$candidate_dir/apps/mobile/assets/receipt_ocr_models" -mindepth 2 -type f -exec truncate -s 0 {} +
          (
            cd "$candidate_dir/apps/mobile"
            flutter clean
            flutter pub get
            cd ios
            pod install --deployment
            test "$(shasum -a 256 Podfile.lock | awk '{print $1}')" = "08afc1413159dcd818b669869736fc56e38a99618a1f951e605b1eea02dc5189"
            cd ..
            flutter build ios --release --no-codesign
          )
          model_free_bytes=$(find "$full_app" -type f -exec stat -f %z {} + | awk '{sum += $1} END {print sum}')
          base_sha=e4d4edd0d6854845cc67b00924f6d22af6a70688
          git cat-file -e "$base_sha^{commit}"
          base_dir="$RUNNER_TEMP/ios-base-app"
          mkdir -p "$base_dir"
          git archive "$base_sha" | tar -x -C "$base_dir"
          cp tools/ocr-models/baselines/ios-pre-native-Podfile.lock "$base_dir/apps/mobile/ios/Podfile.lock"
          (
            cd "$base_dir/apps/mobile"
            flutter pub get
            cd ios
            pod install --deployment
            test "$(shasum -a 256 Podfile.lock | awk '{print $1}')" = "486ba24476c7ae0be32927fa9239599749f285d7a5a48129caebe4437ed6cc30"
            cd ..
            flutter build ios --release --no-codesign
          )
          base_app_bytes=$(find "$base_dir/apps/mobile/build/ios/iphoneos/Runner.app" -type f -exec stat -f %z {} + | awk '{sum += $1} END {print sum}')
          echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
          echo "model_free_bytes=$model_free_bytes" >> "$GITHUB_OUTPUT"
          echo "base_app_bytes=$base_app_bytes" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Build bounded iOS evidence
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          test -f "$RUNNER_TEMP/ios-acceptance.log" || : >"$RUNNER_TEMP/ios-acceptance.log"
          test -f "$RUNNER_TEMP/ios-acceptance.stderr.log" || : >"$RUNNER_TEMP/ios-acceptance.stderr.log"
          node tools/ocr-models/native-acceptance-evidence.mjs \
            --log="$RUNNER_TEMP/ios-acceptance.log" \
            --stderr-log="$RUNNER_TEMP/ios-acceptance.stderr.log" \
            --out="$RUNNER_TEMP/ios-ocr-acceptance.json" \
            --platform=ios \
            --source-sha="$EXPECTED_HEAD" \
            --test-status="${{ steps.acceptance.outputs.status }}" \
            --failure-phase="${{ steps.acceptance.outputs.failure_phase }}" \
            --runner-image="${{ steps.simulator.outputs.runner_image }}" \
            --os-runtime="${{ steps.simulator.outputs.os_runtime }}" \
            --sdk-toolchain="${{ steps.simulator.outputs.sdk_toolchain }}" \
            --device="${{ steps.simulator.outputs.device }}" \
            --native-image="${{ steps.simulator.outputs.native_image }}" \
            --full-bytes="${{ steps.package.outputs.full_bytes }}" \
            --model-free-bytes="${{ steps.package.outputs.model_free_bytes }}" \
            --base-app-bytes="${{ steps.package.outputs.base_app_bytes }}" \
            --base-sha="${{ steps.package.outputs.base_sha }}" \
            --require-complete=true

      - name: Upload bounded iOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ocr-native-acceptance-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/ios-ocr-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce iOS acceptance result
        if: always()
        run: test "${{ steps.acceptance.outputs.status }}" = "0"
