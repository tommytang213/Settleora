name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, tokens, private URLs, personal data, or large logs. Report security issues privately through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reproducible steps.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant app, OS, browser, device, runtime, or deployment details.
    validations:
      required: true
  - type: textarea
    id: screenshots_logs
    attributes:
      label: Screenshots/logs
      description: Add screenshots or short log excerpts only. Do not paste huge logs.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocking
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other relevant context.
    validations:
      required: false
